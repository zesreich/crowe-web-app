<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">

    <!-- Bootstrap CSS -->

    <!-- Font Awesome -->

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8f9fc;
            font-family: 'Nunito', sans-serif;
        }
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 48px 0 0;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1);
            background: #002060;
            color: white;
            width: 224px;
        }
        .sidebar-brand {
            font-size: 1.5rem;
            font-weight: 800;
            padding: 1.5rem 1rem;
            text-align: center;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar-brand img {
            display: block;
            margin: 0 auto;
            width: 80px;
            height: 80px;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,.8);
            padding: 1rem;
            font-weight: 500;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: rgba(255,255,255,1);
            background-color: rgba(255,255,255,.1);
        }
        .sidebar .nav-link i {
            margin-right: 0.5rem;
            width: 1.5rem;
        }
        #content-wrapper {
            margin-left: 224px;
            width: calc(100% - 224px);
        }
        .topbar {
            background-color: white;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, .15);
            padding: 1rem 1.5rem;
        }
        .card {
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, .15);
            border: none;
            margin-bottom: 1.5rem;
        }
        .card-header {
            background: #002060;
            color: white;
            font-weight: 600;
            padding: 1rem 1.5rem;
        }
        .table thead th {
            background-color: #5a5c69;
            color: white;
            font-weight: 600;
            border: none;
        }
        .table tbody tr:hover {
            background-color: #f8f9fc;
        }
        .language-switcher {
            position: relative;
        }
        .language-switcher .btn {
            border-radius: 20px;
            padding: 0.5rem 1rem;
        }
        #theme-switch {
            height: 40px;
            width: 40px;
            padding: 0;
            border-radius: 50%;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #theme-switch:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }
        #theme-switch svg {
            width: 24px;
            height: 24px;
        }
        #theme-switch svg:last-child {
            display: none;
        }
        .darkmode #theme-switch svg:first-child {
            display: none;
        }
        .darkmode #theme-switch svg:last-child {
            display: block !important;
        }
        .darkmode #theme-switch svg {
            fill: #ffffff;
        }
        .file-icon {
            font-size: 1.2rem;
            margin-right: 0.3rem;
        }
    </style>
</head>
<body id="page-top">
    <div id="wrapper">
        <!-- Sidebar -->
        <ul class="sidebar" id="accordionSidebar">
            <a class="sidebar-brand" href="index.html">
                <img src="logo.svg" alt="Crowe HSY Logo">
            </a>
            <hr class="sidebar-divider my-0">
            <li class="nav-item">
                <a class="nav-link" href="dashboard.html">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="client-list.html">
                    <i class="fas fa-building"></i>
                    <span>Müşteriler</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="payments.html">
                    <i class="fas fa-money-bill-wave"></i>
                    <span>Gelen Ödemeler</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="reports.html">
                    <i class="fas fa-file-alt"></i>
                    <span>Raporlar</span>
                </a>
            </li>
        </ul>

        <!-- Content Wrapper -->
        <div id="content-wrapper">
            <!-- Topbar -->
            <nav class="navbar navbar-expand navbar-light topbar mb-4 static-top shadow">
                <button class="btn btn-link d-md-none rounded-circle mr-3" id="sidebarToggle">
                    <i class="fa fa-bars"></i>
                </button>
                <ul class="navbar-nav ml-auto">
                    <!-- Language Switcher -->
                    <li class="nav-item language-switcher mr-3">
                        <button class="btn btn-sm btn-outline-primary" id="langSwitch" onclick="toggleLanguage()">
                            <i class="fas fa-globe"></i> <span id="langText">TR</span>
                        </button>
                    </li>
                    <li class="nav-item dropdown no-arrow" style="margin-right: 1rem;">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <span class="mr-2 d-none d-lg-inline text-gray-600 small" id="userEmail">Admin</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-right shadow">
                            <a class="dropdown-item" href="#">
                                <i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i>
                                Profil
                            </a>
                            <div class="dropdown-divider"></div>
                        </div>
                    </li>
                    <li class="nav-item" style="margin-right: 1rem;">
                        <a class="nav-link" href="#" onclick="Auth.logout(); return false;" style="cursor: pointer;">
                            <i class="fas fa-sign-out-alt mr-2"></i>
                            <span class="d-none d-lg-inline">Çıkış</span>
                        </a>
                    </li>
                    <!-- Dark Mode Switcher -->
                    <li class="nav-item">
                        <button id="theme-switch" aria-label="Switch to dark mode" style="border: none; background: transparent; padding: 0; cursor: pointer; margin-left: 0.5rem;">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" style="fill: #5a5c69;">
                                <path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/>
                            </svg>
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" style="fill: #5a5c69; display: none;">
                                <path d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"/>
                            </svg>
                        </button>
                    </li>
                </ul>
            </nav>

            <!-- Main Content -->
            <div class="container-fluid">
                <div class="card shadow mb-4">
                    <div class="card-header py-3 d-flex justify-content-between align-items-center">
                        <h6 class="m-0 font-weight-bold text-white">Toplam Teklif Sayısı: <span id="totalOffers">350,897</span></h6>
                        <div>
                            <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Teklif ara..." style="display: inline-block; width: 200px;">
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered" id="offersTable" width="100%" cellspacing="0">
                                <thead>
                                    <tr>
                                        <th>Teklif No</th>
                                        <th>Müşteri Adı</th>
                                        <th>Teklif Tipi</th>
                                        <th>Gönderim Tarihi</th>
                                        <th>Durum</th>
                                        <th>PowerPoint Dosyaları</th>
                                        <th>PDF Dosyaları</th>
                                        <th>İşlemler</th>
                                    </tr>
                                </thead>
                                <tbody id="offersTableBody">
                                    <!-- Data will be populated by JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Supabase Config & JS -->
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Authentication System -->
    <script src="auth.js"></script>
    <!-- Dark Mode -->
    <link rel="stylesheet" href="darkmode.css">
    <script src="darkmode.js" defer></script>
    <!-- Prevent Active Link Reload -->
    <script src="prevent-active-link-reload.js"></script>
    <script>
        // Check authentication on page load (DOMContentLoaded ile geciktir)
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                if (typeof Auth !== 'undefined' && !Auth.isAuthenticated()) {
                    window.location.href = 'login.html';
                }
            }, 100);
        });
        
        // Update user info in topbar (same as other pages)
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const currentUser = Auth.getCurrentUser();
                if (currentUser) {
                    // username field contains the email address
                    const userEmail = currentUser.username || currentUser.email || currentUser.fullName || currentUser.full_name;
                    const userEmailElement = document.getElementById('userEmail');
                    if (userEmailElement) {
                        userEmailElement.textContent = userEmail;
                    }
                }
            }, 100);
        });
        
        // Also update immediately if DOM is already loaded
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(function() {
                const currentUser = Auth.getCurrentUser();
                if (currentUser) {
                    const userEmail = currentUser.username || currentUser.email || currentUser.fullName || currentUser.full_name;
                    const userEmailElement = document.getElementById('userEmail');
                    if (userEmailElement) {
                        userEmailElement.textContent = userEmail;
                    }
                }
            }, 100);
        }
        
        // Get Supabase client helper function
        function getSupabaseClient() {
            if (typeof window.supabase !== 'undefined' && window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
                if (!window.SUPABASE_URL.includes('YOUR_') && !window.SUPABASE_ANON_KEY.includes('YOUR_')) {
                    return window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
                }
            }
            return null;
        }
        
        // Supabase functions for offers
        async function getOffersFromSupabase() {
            const supabase = getSupabaseClient();
            if (!supabase) {
                return offersData; // Fallback to static data
            }
            
            try {
                const { data, error } = await supabase
                    .from('offers')
                    .select('*')
                    .order('send_date', { ascending: false });
                
                if (error) {
                    console.error('Supabase error:', error);
                    return offersData; // Fallback to static data
                }
                
                // Convert Supabase format to local format
                return (data || []).map(o => ({
                    id: o.id,
                    offerNo: o.offer_no,
                    clientName: o.client_name,
                    offerType: o.offer_type,
                    sendDate: o.send_date,
                    status: o.status,
                    pptFiles: o.ppt_files || [],
                    pdfFiles: o.pdf_files || []
                }));
            } catch (error) {
                console.error('Error fetching offers:', error);
                return offersData; // Fallback to static data
            }
        }
        
        function toggleLanguage() {
            const currentLang = i18n.currentLang;
            const newLang = currentLang === 'en' ? 'tr' : 'en';
            i18n.setLanguage(newLang);
            document.getElementById('langText').textContent = newLang === 'en' ? 'TR' : 'EN';
        }
        
        // Sample offer data (fallback)
        let offersData = [
            { id: 1, offerNo: 'OFF-2024-001', clientName: 'ABC Construction Inc.', offerType: 'Denetim Hizmetleri', sendDate: '2024-01-15', status: 'Onay Bekliyor', pptFiles: ['presentation_001.pptx'], pdfFiles: ['offer_001.pdf'] },
            { id: 2, offerNo: 'OFF-2024-002', clientName: 'DEF Food Ltd.', offerType: 'Mali Müşavirlik', sendDate: '2024-02-20', status: 'Kabul Edildi', pptFiles: ['presentation_002.pptx'], pdfFiles: ['offer_002.pdf', 'terms_002.pdf'] },
            { id: 3, offerNo: 'OFF-2024-003', clientName: 'GHI Technology', offerType: 'Danışmanlık', sendDate: '2024-03-10', status: 'Reddedildi', pptFiles: ['presentation_003.pptx'], pdfFiles: ['offer_003.pdf'] },
            { id: 4, offerNo: 'OFF-2024-004', clientName: 'JKL Manufacturing', offerType: 'Denetim Hizmetleri', sendDate: '2024-04-05', status: 'Onay Bekliyor', pptFiles: ['presentation_004.pptx', 'backup_004.pptx'], pdfFiles: ['offer_004.pdf'] },
            { id: 5, offerNo: 'OFF-2024-005', clientName: 'MNO Retail', offerType: 'Mali Müşavirlik', sendDate: '2024-05-12', status: 'Kabul Edildi', pptFiles: ['presentation_005.pptx'], pdfFiles: ['offer_005.pdf', 'annex_005.pdf'] },
            // Add more sample offers...
        ];
        
        // Populate table
        function populateTable(offers) {
            const tbody = document.getElementById('offersTableBody');
            tbody.innerHTML = '';
            
            offers.forEach(offer => {
                const row = document.createElement('tr');
                const pptFilesHtml = offer.pptFiles.map(file => 
                    `<a href="#" class="btn btn-sm btn-warning mr-1 mb-1" onclick="downloadPPT('${file}')">
                        <i class="fas fa-file-powerpoint file-icon"></i> ${file}
                    </a>`
                ).join('');
                
                const pdfFilesHtml = offer.pdfFiles.map(file => 
                    `<a href="#" class="btn btn-sm btn-danger mr-1 mb-1" onclick="downloadPDF('${file}')">
                        <i class="fas fa-file-pdf file-icon"></i> ${file}
                    </a>`
                ).join('');
                
                row.innerHTML = `
                    <td>${offer.offerNo}</td>
                    <td>${offer.clientName}</td>
                    <td>${offer.offerType}</td>
                    <td>${offer.sendDate}</td>
                    <td><span class="badge badge-${offer.status === 'Kabul Edildi' ? 'success' : offer.status === 'Reddedildi' ? 'danger' : 'warning'}">${offer.status}</span></td>
                    <td>${pptFilesHtml}</td>
                    <td>${pdfFilesHtml}</td>
                    <td>
                        <button class="btn btn-sm btn-info" onclick="viewOfferDetails(${offer.id})">
                            <i class="fas fa-eye"></i> Detay
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
            
            document.getElementById('totalOffers').textContent = offers.length;
        }
        
        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const filteredOffers = offersData.filter(offer => 
                offer.offerNo.toLowerCase().includes(searchTerm) ||
                offer.clientName.toLowerCase().includes(searchTerm) ||
                offer.offerType.toLowerCase().includes(searchTerm)
            );
            populateTable(filteredOffers);
        });
        
        // View offer details
        function viewOfferDetails(offerId) {
            const offer = offersData.find(o => o.id === offerId);
            if (offer) {
                alert(`Teklif Detayları:\n\nTeklif No: ${offer.offerNo}\nMüşteri: ${offer.clientName}\nTip: ${offer.offerType}\nGönderim Tarihi: ${offer.sendDate}\nDurum: ${offer.status}\n\nPowerPoint Dosyaları: ${offer.pptFiles.join(', ')}\nPDF Dosyaları: ${offer.pdfFiles.join(', ')}`);
            }
        }
        
        // Download PowerPoint
        function downloadPPT(filename) {
            alert(`PowerPoint dosyası indiriliyor: ${filename}\n\nNot: Gerçek uygulamada bu dosya sunucudan indirilecektir.`);
            // In real app: window.open(`/downloads/${filename}`, '_blank');
        }
        
        // Download PDF
        function downloadPDF(filename) {
            alert(`PDF dosyası indiriliyor: ${filename}\n\nNot: Gerçek uygulamada bu dosya sunucudan indirilecektir.`);
            // In real app: window.open(`/downloads/${filename}`, '_blank');
        }
        
        // Initialize table
        async function initOffers() {
            offersData = await getOffersFromSupabase();
            populateTable(offersData);
        }
        initOffers();
        
        // Update language switcher text on language change
        document.addEventListener('languageChanged', function() {
            document.getElementById('langText').textContent = i18n.currentLang === 'en' ? 'TR' : 'EN';
        });
    </script>
</body>
