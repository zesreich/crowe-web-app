<!DOCTYPE html>
<html lang="tr">
<head>
    <script>
    (function(){try{var d=localStorage.getItem('darkmode');var a=localStorage.getItem('hsy-atlas-theme');var dark=d==='active'||(d===null&&a==='dark')||(d===null&&a===null&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(dark){document.documentElement.setAttribute('data-theme','dark');document.documentElement.classList.add('darkmode');}else{document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();
    </script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Denetçi Şifre Değiştirme | Crowe HSY</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link href="atlas-shell.css" rel="stylesheet">
    <link href="atlas-auth.css" rel="stylesheet">
</head>
<body class="atlas-auth">

  <div class="atlas-auth-top">
    <button class="icon-btn" type="button" id="themeToggle" aria-label="Tema"><i class="ph ph-moon" id="themeIcon"></i></button>
  </div>
<div class="change-card">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Denetçi Şifre Güncelleme</h1>
            <span class="badge-default" id="auditorBadge">Crowe HSY</span>
        </div>
        <p class="subtitle">
            Güvenliğiniz için ilk girişinizde şifrenizi değiştirmeniz gerekir. Yeni şifreniz <strong>Crowe2022!</strong> ile aynı olmamalı ve en az 8 karakter olmalıdır.
        </p>

        <div id="alertArea"></div>

        <form id="auditorPasswordChangeForm" novalidate>
            <div class="form-group">
                <label for="newPassword">Yeni Şifre</label>
                <input type="password" class="form-control" id="newPassword" placeholder="Yeni şifrenizi yazın" required minlength="8" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirmPassword">Yeni Şifre (Tekrar)</label>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Yeni şifreyi tekrar yazın" required minlength="8" autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block">
                <i class="fas fa-unlock mr-2"></i> Şifremi Güncelle
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="auditor-login.html" class="back-link"><i class="fas fa-arrow-left mr-1"></i> Denetçi girişine dön</a>
        </div>
    </div>

    <script>
        const DEFAULT_AUDITOR_PASSWORD = 'Crowe2022!';
        const pendingAuditorEmail = localStorage.getItem('auditorPendingPasswordChange');

        if (!pendingAuditorEmail) {
            window.location.href = 'auditor-login.html';
        }

        document.getElementById('auditorBadge').textContent = pendingAuditorEmail || 'Crowe HSY';

        function showAlert(type, message) {
            const alertArea = document.getElementById('alertArea');
            alertArea.innerHTML = `
                <div class="alert alert-${type}" role="alert">
                    ${message}
                </div>
            `;
        }

        document.getElementById('auditorPasswordChangeForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();

            if (!newPassword || !confirmPassword) {
                showAlert('danger', 'Lütfen her iki alanı da doldurun.');
                return;
            }

            if (newPassword.length < 8) {
                showAlert('danger', 'Yeni şifre en az 8 karakter olmalıdır.');
                return;
            }

            if (newPassword === DEFAULT_AUDITOR_PASSWORD) {
                showAlert('danger', 'Yeni şifreniz ilk giriş şifresi olan Crowe2022! ile aynı olamaz.');
                return;
            }

            if (newPassword !== confirmPassword) {
                showAlert('danger', 'Yeni şifre ve tekrarı eşleşmiyor.');
                return;
            }

            const passwordKey = 'auditorPassword_' + pendingAuditorEmail.toLowerCase();
            const changedKey = 'auditorPasswordChanged_' + pendingAuditorEmail.toLowerCase();

            localStorage.setItem(passwordKey, newPassword);
            localStorage.setItem(changedKey, 'true');
            localStorage.removeItem('auditorPendingPasswordChange');

            showAlert('success', 'Şifreniz güncellendi. Yönlendiriliyorsunuz...');
            setTimeout(function() {
                window.location.href = 'auditor-dashboard.html';
            }, 1200);
        });
    </script>
