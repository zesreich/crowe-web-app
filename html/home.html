<!DOCTYPE html>
<html lang="tr">
<head>
  <script>
  (function(){try{document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.remove('darkmode');document.documentElement.removeAttribute('data-brand');}catch(e){}})();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HSY Crowe | Denetim ekosistemi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --mustard: #fdb913;
      --ink: #111111;
      --muted: #5b5b5b;
      --line: #e8e8e8;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: #fff;
      color: var(--ink);
    }
    .home-shell {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      min-height: 100dvh;
    }
    .home-visual {
      position: relative;
      overflow: hidden;
      background: #0f172a;
      min-height: 100%;
    }
    .home-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      opacity: 0;
      transform: scale(1.06);
      transition: opacity 1s ease, transform 12s ease;
      pointer-events: none;
    }
    .home-slide.is-active {
      opacity: 1;
      transform: scale(1);
      z-index: 1;
    }
    .home-visual-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        linear-gradient(105deg, rgba(8, 12, 20, 0.55) 0%, rgba(8, 12, 20, 0.2) 48%, rgba(8, 12, 20, 0.45) 100%),
        linear-gradient(180deg, transparent 40%, rgba(8, 12, 20, 0.7) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2.5rem;
      color: #fff;
      pointer-events: none;
    }
    .home-visual-overlay .brand-line {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mustard);
      margin: 0 0 0.65rem;
    }
    .home-visual-overlay h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.75rem, 2.6vw, 2.55rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      max-width: 14ch;
      line-height: 1.15;
    }
    .home-visual-overlay p {
      margin: 0;
      max-width: 36ch;
      color: rgba(255,255,255,0.88);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .home-dots {
      position: absolute;
      left: 2.5rem;
      bottom: 1.25rem;
      z-index: 3;
      display: flex;
      gap: 0.45rem;
    }
    .home-dots button {
      width: 0.55rem;
      height: 0.55rem;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.45);
      padding: 0;
      cursor: pointer;
    }
    .home-dots button.is-active {
      width: 1.35rem;
      background: var(--mustard);
    }
    .home-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background:
        radial-gradient(ellipse at 90% 0%, rgba(253,185,19,0.12), transparent 42%),
        #fff;
    }
    .home-card {
      width: 100%;
      max-width: 24rem;
      animation: homeIn 480ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes homeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }
    .home-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }
    .home-brand-mark {
      width: 2.75rem;
      height: 2.75rem;
      border-radius: 0.85rem;
      background: #111;
      color: var(--mustard);
      display: grid;
      place-items: center;
      font-size: 1.25rem;
      flex-shrink: 0;
    }
    .home-brand strong {
      display: block;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .home-brand span {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }
    .home-card h2 {
      margin: 0 0 0.45rem;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .home-card .lead {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: 0.925rem;
      line-height: 1.55;
    }
    .home-actions {
      display: grid;
      gap: 0.65rem;
    }
    .btn-home-primary,
    .btn-home-secondary {
      height: 2.85rem;
      border-radius: 0.65rem;
      font-weight: 700;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      text-decoration: none;
      transition: filter 0.15s ease, background 0.15s ease, color 0.15s ease;
    }
    .btn-home-primary {
      background: var(--mustard);
      border: 1px solid var(--mustard);
      color: #111;
    }
    .btn-home-primary:hover {
      filter: brightness(0.96);
      color: #111;
      text-decoration: none;
    }
    .btn-home-secondary {
      background: #fff;
      border: 1px solid var(--line);
      color: #222;
      font-weight: 600;
    }
    .btn-home-secondary:hover {
      background: #f7f7f7;
      color: #111;
      text-decoration: none;
    }
    .home-foot {
      margin-top: 1.75rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      font-size: 0.75rem;
      color: #888;
      line-height: 1.45;
    }
    @media (max-width: 900px) {
      .home-shell { grid-template-columns: 1fr; }
      .home-visual { min-height: 38vh; }
      .home-visual-overlay { padding: 1.25rem; }
      .home-visual-overlay h1 { max-width: none; }
      .home-dots { left: 1.25rem; bottom: 0.85rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .home-slide { transition: opacity 200ms ease; transform: none !important; }
      .home-card { animation: none; }
    }
  </style>
</head>
<body>
  <div class="home-shell">
    <section class="home-visual" aria-label="Tanıtım görselleri">
      <img class="home-slide is-active" src="log-in_images/slide-1.jpg" alt="">
      <img class="home-slide" src="log-in_images/slide-2.jpg" alt="">
      <img class="home-slide" src="log-in_images/slide-3.jpg" alt="">
      <img class="home-slide" src="log-in_images/slide-4.jpg" alt="">
      <img class="home-slide" src="log-in_images/slide-5.jpg" alt="">
      <img class="home-slide" src="log-in_images/slide-6.jpg" alt="">
      <div class="home-visual-overlay">
        <p class="brand-line">HSY Crowe</p>
        <h1>Denetim ekosistemine hoş geldiniz</h1>
        <p>Yönetici ve denetçi ekipleri için güvenli, tek merkezden erişim.</p>
      </div>
      <div class="home-dots" id="homeDots" role="tablist" aria-label="Slayt seçimi"></div>
    </section>

    <section class="home-panel">
      <div class="home-card">
        <div class="home-brand">
          <div class="home-brand-mark" aria-hidden="true"><i class="ph ph-compass-tool"></i></div>
          <div>
            <strong>HSY Crowe</strong>
            <span>Bağımsız denetim platformu</span>
          </div>
        </div>

        <h2>Giriş seçin</h2>
        <p class="lead">Rolünüze uygun portal ile devam edin.</p>

        <div class="home-actions">
          <a class="btn-home-primary" href="login.html">
            <i class="ph ph-buildings"></i> Yönetici Girişi
          </a>
          <a class="btn-home-secondary" href="auditor-login.html">
            <i class="ph ph-user-focus"></i> Denetçi Girişi
          </a>
        </div>

        <p class="home-foot">
          © <span id="year"></span> Crowe HSY Bağımsız Denetim ve YMM.
        </p>
      </div>
    </section>
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    (function () {
      var slides = Array.prototype.slice.call(document.querySelectorAll('.home-slide'));
      var dotsWrap = document.getElementById('homeDots');
      var index = 0;
      var timer = null;
      function show(i) {
        index = (i + slides.length) % slides.length;
        slides.forEach(function (slide, idx) {
          slide.classList.toggle('is-active', idx === index);
        });
        Array.prototype.forEach.call(dotsWrap.children, function (dot, idx) {
          dot.classList.toggle('is-active', idx === index);
        });
      }
      slides.forEach(function (_, idx) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-label', 'Slayt ' + (idx + 1));
        btn.addEventListener('click', function () { show(idx); restart(); });
        dotsWrap.appendChild(btn);
      });
      function restart() {
        if (timer) clearInterval(timer);
        timer = setInterval(function () { show(index + 1); }, 15000);
      }
      show(0);
      restart();
    })();
  </script>
</body>
</html>
