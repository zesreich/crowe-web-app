<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Crowe HSY - Login Page">
    <meta name="author" content="">
    <title>CROWE HSY - Login</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        
        html,
        body {
            overflow: hidden;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Nunito', sans-serif;
            position: relative; /* Z-index için gerekli */
            background: radial-gradient(circle at top, #010409 0%, #020617 45%, #000000 100%);
            overflow: hidden;
        }
        
        .webgl {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            outline: none;
            z-index: 0; /* Galaxy animasyonunu arkaya al */
            pointer-events: none;
            display: block;
        }
        
        .container {
            position: relative;
            z-index: 10; /* Giriş panelini öne al */
        }
        
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 3rem;
            max-width: 450px;
            width: 100%;
            position: relative;
            z-index: 10; /* Giriş panelini öne al */
        }
        .login-icon {
            width: 150px;
            height: 150px;
            margin-bottom: 20px;
            color: #4e73df;
        }
        .btn-primary {
            background-color: #4e73df;
            border-color: #4e73df;
        }
        .btn-primary:hover {
            background-color: #224abe;
            border-color: #224abe;
        }
        #hata, #onay {
            display: none;
        }
        .language-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .language-switcher .btn {
            border-radius: 20px;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.9);
        }
    </style>
</head>
<body>
    <!-- Language Switcher -->
    <div class="language-switcher">
        <button class="btn btn-sm btn-outline-primary" id="langSwitch" onclick="toggleLanguage()">
            <i class="fas fa-globe"></i> <span id="langText">TR</span>
        </button>
    </div>
    
    <canvas class="webgl"></canvas>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="login-card">
                    <div class="text-center mb-4">
                        <img src="logo.svg" class="login-icon" style="width: 150px; height: 150px; object-fit: contain;" alt="Logo">
                        <h1 class="h4 text-gray-900 mb-2" data-i18n="welcome">WELCOME!</h1>
                        <h2 class="text-primary mb-4" data-i18n="companyName">CROWE HSY</h2>
                        <p class="text-muted" data-i18n="platformDescription">Financial Advisor Management Platform</p>
                    </div>
                    
                    <form id="loginForm">
                        <div class="form-group">
                            <input type="text" class="form-control form-control-user" id="loginKul" data-i18n-placeholder="username" placeholder="Username..." required autocomplete="username">
                        </div>
                        
                        <div class="form-group">
                            <input type="password" class="form-control form-control-user" id="loginPas" data-i18n-placeholder="password" placeholder="Password..." required autocomplete="current-password">
                        </div>
                        
                        <div class="form-group" id="twoFactorGroup" style="display: none;">
                            <input type="text" class="form-control form-control-user" id="login2FA" data-i18n-placeholder="twoFactorCode" placeholder="2FA Code (6 digits)" maxlength="6" pattern="[0-9]{6}">
                            <small class="text-muted" data-i18n="twoFactorCodeDescription">Enter the 6-digit code sent to your email address.</small>
                        </div>
                        
                        <a class="btn btn-primary btn-user btn-block text-white" href="#" id="loginBtn">
                            <i class="fas fa-sign-in-alt"></i> <span data-i18n="loginButton">Login</span>
                        </a>
                        
                        <hr>
                    </form>
                    
                    <div class="text-center">
                        <a class="small" href="#" data-i18n="forgotPassword">Forgot Password?</a>
                    </div>
                    
                    <div class="text-center mt-3">
                        <a href="home.html" class="btn btn-secondary btn-sm">
                            <i class="fas fa-arrow-left"></i> <span data-i18n="backToHome">Back to Home</span>
                        </a>
                    </div>
                    
                    <!-- Hata/Başarı Mesajları -->
                    <div id="hata" class="alert alert-danger mt-3" style="display: none;">
                        <div id="hataMesaji"></div>
                    </div>
                    <div id="onay" class="alert alert-success mt-3" style="display: none;">
                        <div id="onayMesaji"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Supabase Config & JS -->
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Authentication Helper -->
    <script src="auth.js"></script>
    <!-- i18n System -->
    <script src="i18n.js"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script>
        const DEFAULT_ADMIN_PASSWORD = 'Crowe2022!';
        const ADMIN_USERS = [
            { username: 'mehmetali.sariad@crowehsy.net', fullName: 'Mehmet Ali Sariad', role: 'admin' },
            { username: 'ozkan.cengiz@crowehsy.net', fullName: 'Özkan Cengiz', role: 'admin' },
            { username: 'mert.cengiz@crowehsy.net', fullName: 'Mert Cengiz', role: 'admin' },
            { username: 'hakan.kilic@crowehsy.net', fullName: 'Hakan Kılıç', role: 'admin' },
            { username: 'eda.sefer@crowehsy.net', fullName: 'Eda Sefer', role: 'admin' }
        ];

        function getStoredPassword(email) {
            const key = 'userPassword_' + email.toLowerCase();
            return localStorage.getItem(key);
        }

        function setStoredPassword(email, password) {
            const key = 'userPassword_' + email.toLowerCase();
            localStorage.setItem(key, password);
        }

        function hasPasswordChanged(email) {
            return localStorage.getItem('passwordChanged_' + email.toLowerCase()) === 'true';
        }

        function markPasswordChanged(email) {
            localStorage.setItem('passwordChanged_' + email.toLowerCase(), 'true');
        }

        function setAdminSession(user) {
            const payload = {
                username: user.username,
                fullName: user.fullName || user.username,
                role: user.role || 'admin',
                loginTime: new Date().toISOString()
            };
            localStorage.setItem('auth_user', JSON.stringify(payload));
            if (typeof Auth !== 'undefined' && Auth.generateToken) {
                localStorage.setItem('auth_token', Auth.generateToken());
            } else {
                localStorage.setItem('auth_token', 'token_' + Date.now());
            }
        }

        function clearAdminSession() {
            localStorage.removeItem('auth_user');
            localStorage.removeItem('auth_token');
        }

        function toggleLanguage() {
            const currentLang = i18n.currentLang;
            const newLang = currentLang === 'en' ? 'tr' : 'en';
            i18n.setLanguage(newLang);
            document.getElementById('langText').textContent = newLang === 'en' ? 'TR' : 'EN';
            updatePlaceholders();
        }
        
        function updatePlaceholders() {
            $('#loginKul').attr('placeholder', i18n.t('username'));
            $('#loginPas').attr('placeholder', i18n.t('password'));
            $('#login2FA').attr('placeholder', i18n.t('twoFactorCode'));
        }
        
        // Update language switcher text on language change
        document.addEventListener('languageChanged', function() {
            document.getElementById('langText').textContent = i18n.currentLang === 'en' ? 'TR' : 'EN';
            updatePlaceholders();
        });
    </script>
    
    <!-- Three.js Galaxy Animation -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!THREE) {
                console.error('Three.js yüklenemedi');
                return;
            }

            const canvas = document.querySelector('canvas.webgl');
            const scene = new THREE.Scene();

            const parameters = {
                count: 100000,
                size: 0.008,
                radius: 2.5,
                branches: 3,
                spin: 2,
                randomness: 2,
                randomnessPower: 3,
                insideColor: '#f97316',
                outsideColor: '#2563eb'
            };

            let material = null;
            let geometry = null;
            let points = null;

            const generateGalaxy = () => {
                if (points !== null) {
                    geometry.dispose();
                    material.dispose();
                    scene.remove(points);
                }

                material = new THREE.PointsMaterial({
                    size: parameters.size,
                    sizeAttenuation: true,
                    depthWrite: false,
                    blending: THREE.AdditiveBlending,
                    vertexColors: true
                });

                geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(parameters.count * 3);
                const colors = new Float32Array(parameters.count * 3);
                const colorInside = new THREE.Color(parameters.insideColor);
                const colorOutside = new THREE.Color(parameters.outsideColor);

                for (let i = 0; i < parameters.count; i++) {
                    const i3 = i * 3;
                    const radius = Math.random() * parameters.radius;
                    const spinAngle = radius * parameters.spin;
                    const branchAngle = (i % parameters.branches) / parameters.branches * Math.PI * 2;

                    const randomX = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1);
                    const randomY = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1);
                    const randomZ = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1);

                    positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
                    positions[i3 + 1] = randomY * 0.3;
                    positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

                    const mixedColor = colorInside.clone();
                    mixedColor.lerp(colorOutside, radius / parameters.radius);

                    colors[i3] = mixedColor.r;
                    colors[i3 + 1] = mixedColor.g;
                    colors[i3 + 2] = mixedColor.b;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

                points = new THREE.Points(geometry, material);
                scene.add(points);
            };

            generateGalaxy();

            const sizes = {
                width: window.innerWidth,
                height: window.innerHeight
            };

            const camera = new THREE.PerspectiveCamera(75, sizes.width / sizes.height, 0.1, 100);
            camera.position.set(3, 2.5, 3);
            scene.add(camera);

            // OrbitControls için fallback
            let controls = null;
            if (typeof THREE.OrbitControls !== 'undefined') {
                controls = new THREE.OrbitControls(camera, canvas);
            } else if (typeof OrbitControls !== 'undefined') {
                controls = new OrbitControls(camera, canvas);
            } else {
                console.warn('OrbitControls yüklenemedi, animasyon devre dışı');
            }
            
            if (controls) {
                controls.enableDamping = true;
                controls.enablePan = false;
                controls.enableZoom = false;
            }

            const renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: true
            });
            renderer.setSize(sizes.width, sizes.height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 0);

            window.addEventListener('resize', () => {
                sizes.width = window.innerWidth;
                sizes.height = window.innerHeight;

                camera.aspect = sizes.width / sizes.height;
                camera.updateProjectionMatrix();

                renderer.setSize(sizes.width, sizes.height);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            });

            const clock = new THREE.Clock();

            const tick = () => {
                const elapsedTime = clock.getElapsedTime();

                if (controls) {
                    controls.update();
                }

                camera.position.x = Math.cos(elapsedTime * 0.05) * 3;
                camera.position.z = Math.sin(elapsedTime * 0.05) * 3;
                camera.lookAt(0, 0, 0);

                renderer.render(scene, camera);

                window.requestAnimationFrame(tick);
            };

            tick();
        });
    </script>
    
    <script>
        $(function(){
            // Check if user is already authenticated, redirect to dashboard
            setTimeout(function() {
                if (typeof Auth !== 'undefined' && Auth.isAuthenticated()) {
                    console.log('User already authenticated, redirecting to dashboard...');
                    window.location.href = 'dashboard.html';
                    return;
                }
            }, 100);
            
            var twoFactorRequired = false;
            
            function hataAc(icerik){
                $("#hataMesaji").text(icerik);
                $("#hata").show();
                $("#onay").hide();
            }
            
            function onayAc(icerik){
                $("#onayMesaji").text(icerik);
                $("#onay").show();
                $("#hata").hide();
            }
            
            async function handleLogin(){
                var kul = $("#loginKul").val();
                var pas = $("#loginPas").val();
                var twoFactorCode = $("#login2FA").val();
                
                if (!kul || !pas) {
                    hataAc(i18n.t('loginError'));
                    return false;
                }
                
                if (twoFactorRequired && (!twoFactorCode || twoFactorCode.length !== 6)) {
                    hataAc(i18n.t('loginError2FA'));
                    return false;
                }

                try {
                    console.log('Attempting login for:', kul);
                    const result = await Auth.login(kul, pas.trim());
                    console.log('Login result:', result);
                
                    if (!result.success) {
                        console.error('Login failed:', result.error);
                        hataAc(result.error || i18n.t('loginErrorWrong'));
                        return false;
                    }

                    console.log('Login successful, storing session...');
                    localStorage.setItem('auditorUser', result.user.username);
                    if (typeof Auth.clearPendingPasswordChange === 'function') {
                        Auth.clearPendingPasswordChange();
                    }
                    markPasswordChanged(result.user.username);
                    
                    // Wait a bit for localStorage to be written, then verify
                    setTimeout(function() {
                        // Verify authentication was stored
                        if (typeof Auth !== 'undefined' && Auth.isAuthenticated()) {
                            console.log('Authentication verified, redirecting...');
                            onayAc('Giriş başarılı, yönlendiriliyorsunuz...');
                            setTimeout(function(){
                                console.log('Redirecting to dashboard...');
                                window.location.href = 'dashboard.html';
                            }, 400);
                        } else {
                            console.error('Authentication not stored properly');
                            console.log('auth_user:', localStorage.getItem('auth_user'));
                            console.log('auth_token:', localStorage.getItem('auth_token'));
                            hataAc('Oturum kaydedilemedi. Lütfen tekrar deneyin.');
                        }
                    }, 100);
                    return true;
                } catch (err) {
                    console.error('Login error:', err);
                    hataAc(i18n.t('loginErrorWrong') + ': ' + (err.message || 'Bilinmeyen hata'));
                    return false;
                }
            }

            $("#loginBtn").on('click', function(e){
                e.preventDefault();
                handleLogin();
                return false;
            });

            $("#loginForm").on('submit', function(e){
                e.preventDefault();
                handleLogin();
                return false;
            });
        });
    </script>
</body>
</html>
