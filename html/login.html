<!DOCTYPE html>
<html lang="tr">
<head>
  <script>
  (function(){try{document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.remove('darkmode');document.documentElement.removeAttribute('data-brand');}catch(e){}})();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CROWE HSY - Yönetici Girişi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="atlas-shell.css" rel="stylesheet">
  <style>
    :root {
      --login-mustard: #fdb913;
      --login-ink: #111111;
      --login-muted: #5b5b5b;
      --login-line: #e8e8e8;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      background: #fff;
      color: var(--login-ink);
    }
    .login-shell {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      min-height: 100dvh;
    }
    .login-visual {
      position: relative;
      overflow: hidden;
      background: #0f172a;
      min-height: 100%;
    }
    .login-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      opacity: 0;
      transform: scale(1.06);
      transition: opacity 1s ease, transform 12s ease;
      pointer-events: none;
    }
    .login-slide.is-active {
      opacity: 1;
      transform: scale(1);
      z-index: 1;
    }
    .login-visual-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        linear-gradient(105deg, rgba(8, 12, 20, 0.55) 0%, rgba(8, 12, 20, 0.2) 48%, rgba(8, 12, 20, 0.45) 100%),
        linear-gradient(180deg, transparent 40%, rgba(8, 12, 20, 0.7) 100%);
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2.5rem;
      color: #fff;
      pointer-events: none;
    }
    .login-visual-overlay h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.6rem, 2.4vw, 2.4rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      max-width: 18ch;
    }
    .login-visual-overlay p {
      margin: 0;
      max-width: 38ch;
      color: rgba(255,255,255,0.88);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .login-dots {
      position: absolute;
      left: 2.5rem;
      bottom: 1.25rem;
      z-index: 3;
      display: flex;
      gap: 0.45rem;
    }
    .login-dots button {
      width: 0.55rem;
      height: 0.55rem;
      border: 0;
      border-radius: 999px;
      background: rgba(255,255,255,0.45);
      padding: 0;
      cursor: pointer;
    }
    .login-dots button.is-active {
      width: 1.35rem;
      background: var(--login-mustard);
    }
    .login-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: #fff;
    }
    .login-card { width: 100%; max-width: 24rem; }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
    }
    .login-brand-mark {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 0.65rem;
      background: var(--login-mustard);
      color: #111;
      display: grid;
      place-items: center;
      font-size: 1.25rem;
    }
    .login-brand strong {
      display: block;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .login-brand span {
      display: block;
      font-size: 0.75rem;
      color: var(--login-muted);
    }
    .login-card h2 {
      margin: 0 0 0.35rem;
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .login-card .lead {
      margin: 0 0 1.5rem;
      color: var(--login-muted);
      font-size: 0.9rem;
    }
    .login-card .form-group { margin-bottom: 0.9rem; }
    .login-card label {
      display: block;
      margin-bottom: 0.35rem;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #222;
    }
    .login-card .form-control {
      height: 2.75rem;
      border: 1px solid var(--login-line);
      border-radius: 0.65rem;
      padding: 0.55rem 0.85rem;
      font-size: 0.9rem;
      background: #fafafa;
    }
    .login-card .form-control:focus {
      background: #fff;
      border-color: var(--login-mustard);
      box-shadow: 0 0 0 3px rgba(253, 185, 19, 0.25);
    }
    .login-actions {
      margin-top: 1.15rem;
      display: grid;
      gap: 0.65rem;
    }
    .btn-login-primary {
      height: 2.85rem;
      border: 0;
      border-radius: 0.65rem;
      background: var(--login-mustard);
      color: #111;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      text-decoration: none;
    }
    .btn-login-primary:hover { filter: brightness(0.96); color: #111; text-decoration: none; }
    .btn-login-secondary {
      height: 2.55rem;
      border: 1px solid var(--login-line);
      border-radius: 0.65rem;
      background: #fff;
      color: #222;
      font-weight: 600;
      font-size: 0.875rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      text-decoration: none;
    }
    .btn-login-secondary:hover { background: #f7f7f7; color: #111; text-decoration: none; }
    #hata, #onay {
      margin-top: 1rem;
      border-radius: 0.65rem;
      font-size: 0.85rem;
    }
    @media (max-width: 900px) {
      .login-shell { grid-template-columns: 1fr; }
      .login-visual { min-height: 38vh; }
      .login-visual-overlay { padding: 1.25rem; }
      .login-dots { left: 1.25rem; bottom: 0.85rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      .login-slide { transition: opacity 200ms ease; transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="login-shell">
    <section class="login-visual" aria-label="Tanıtım görselleri">
      <img class="login-slide is-active" src="log-in_images/slide-1.jpg" alt="">
      <img class="login-slide" src="log-in_images/slide-2.jpg" alt="">
      <img class="login-slide" src="log-in_images/slide-3.jpg" alt="">
      <img class="login-slide" src="log-in_images/slide-4.jpg" alt="">
      <img class="login-slide" src="log-in_images/slide-5.jpg" alt="">
      <img class="login-slide" src="log-in_images/slide-6.jpg" alt="">
      <div class="login-visual-overlay">
        <h1>Yönetim paneline hoş geldiniz</h1>
        <p>HSY Crowe yönetici girişi — müşteri, teklif, sözleşme ve ödeme operasyonları tek yerde.</p>
      </div>
      <div class="login-dots" id="loginDots" role="tablist" aria-label="Slayt seçimi"></div>
    </section>

    <section class="login-panel">
      <div class="login-card">
        <div class="login-brand">
          <div class="login-brand-mark" aria-hidden="true"><i class="ph ph-compass-tool"></i></div>
          <div>
            <strong>HSY Crowe</strong>
            <span>Yönetici girişi</span>
          </div>
        </div>

        <h2>Giriş yap</h2>
        <p class="lead">Kurumsal e-posta ve şifrenizle devam edin.</p>

        <form id="loginForm" autocomplete="on">
          <div class="form-group">
            <label for="loginKul">E-posta</label>
            <input type="email" class="form-control" id="loginKul" placeholder="kullanici@crowehsy.net" required autocomplete="username">
          </div>
          <div class="form-group">
            <label for="loginPas">Şifre</label>
            <input type="password" class="form-control" id="loginPas" placeholder="Şifreniz" required autocomplete="current-password">
          </div>
          <div class="login-actions">
            <a class="btn-login-primary" href="#" id="loginBtn">
              <i class="ph ph-sign-in"></i> Giriş Yap
            </a>
            <a class="btn-login-secondary" href="home.html">
              <i class="ph ph-arrow-left"></i> Ana sayfaya dön
            </a>
          </div>
        </form>

        <div id="hata" class="alert alert-danger" style="display:none;"><div id="hataMesaji"></div></div>
        <div id="onay" class="alert alert-success" style="display:none;"><div id="onayMesaji"></div></div>
      </div>
    </section>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    (function () {
      var slides = Array.prototype.slice.call(document.querySelectorAll('.login-slide'));
      var dotsWrap = document.getElementById('loginDots');
      var index = 0;
      var timer = null;
      function show(i) {
        index = (i + slides.length) % slides.length;
        slides.forEach(function (slide, idx) {
          slide.classList.toggle('is-active', idx === index);
        });
        Array.prototype.forEach.call(dotsWrap.children, function (dot, idx) {
          dot.classList.toggle('is-active', idx === index);
        });
      }
      slides.forEach(function (_, idx) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-label', 'Slayt ' + (idx + 1));
        btn.addEventListener('click', function () { show(idx); restart(); });
        dotsWrap.appendChild(btn);
      });
      function restart() {
        if (timer) clearInterval(timer);
        timer = setInterval(function () { show(index + 1); }, 15000);
      }
      show(0);
      restart();
    })();

    $(function () {
      function hataAc(icerik) {
        $("#hataMesaji").text(icerik);
        $("#hata").show();
        $("#onay").hide();
      }
      function onayAc(icerik) {
        $("#onayMesaji").text(icerik);
        $("#onay").show();
        $("#hata").hide();
      }

      async function handleLogin() {
        var kul = $("#loginKul").val();
        var pas = $("#loginPas").val();
        if (!kul || !pas) {
          hataAc('Lütfen e-posta ve şifre giriniz.');
          return;
        }
        try {
          var result = await Auth.login(kul, pas.trim());
          if (!result.success) {
            hataAc(result.error || 'Giriş başarısız.');
            return;
          }
          localStorage.setItem('loginPortal', 'admin');
          localStorage.removeItem('auditorUser');
          if (result.requiresPasswordChange) {
            onayAc('İlk giriş: şifrenizi değiştirmeniz gerekiyor…');
            setTimeout(function () { window.location.href = 'password-change.html'; }, 500);
            return;
          }
          onayAc('Giriş başarılı, yönlendiriliyorsunuz…');
          setTimeout(function () { window.location.href = 'dashboard.html'; }, 400);
        } catch (err) {
          console.error(err);
          hataAc('Giriş sırasında bir hata oluştu.');
        }
      }

      $("#loginBtn").on('click', function (e) {
        e.preventDefault();
        handleLogin();
      });
      $("#loginForm").on('submit', function (e) {
        e.preventDefault();
        handleLogin();
      });
    });
  </script>
</body>
</html>
