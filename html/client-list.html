<head>

    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            background: radial-gradient(circle at top, #1f2933, #050608 55%);
            color: #e5e7eb;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", 'Nunito', sans-serif;
            min-height: 100vh;
        }
        
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            background: linear-gradient(180deg, #020617, #111827 55%, #020617);
            border-right: 1px solid rgba(148, 163, 184, 0.2);
            color: #e5e7eb;
            width: 260px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px 18px;
            gap: 20px;
        }
        
        #accordionSidebar::after {
            content: "";
            display: block;
            flex-grow: 1;
            background: transparent;
        }
        
        .sidebar-brand {
            font-size: 1.5rem;
            font-weight: 800;
            padding: 1.5rem 1rem;
            text-align: center;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .sidebar-brand img {
            display: block;
            margin: 0 auto;
            width: 80px;
            height: 80px;
        }
        
        .sidebar .nav-link {
            color: rgba(229, 231, 235, 0.8);
            padding: 8px 10px;
            font-weight: 500;
            font-size: 13px;
            border-radius: 10px;
            transition: all 0.18s ease-out;
            display: flex;
            align-items: center;
            text-decoration: none;
        }
        
        .sidebar .nav-link:hover {
            background: rgba(15, 23, 42, 0.9);
            border-color: rgba(148, 163, 184, 0.5);
            color: rgba(229, 231, 235, 1);
        }
        
        .sidebar .nav-link.active {
            background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.14), rgba(15, 23, 42, 1));
            border: 1px solid rgba(56, 189, 248, 0.7);
            box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.4);
            color: rgba(229, 231, 235, 1);
        }
        
        .sidebar .nav-link i {
            margin-right: 0.5rem;
            width: 1.5rem;
        }
        
        #content-wrapper {
            margin-left: 260px;
            width: calc(100% - 260px);
            background: transparent;
        }
        
        .topbar {
            background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.12), rgba(15, 23, 42, 1));
            border-bottom: 1px solid rgba(148, 163, 184, 0.35);
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.9);
            padding: 1rem 1.5rem;
            color: #e5e7eb;
        }
        
        .topbar h3 {
            color: #e5e7eb !important;
        }
        
        .topbar .text-gray-600 {
            color: #9ca3af !important;
        }
        
        .topbar .dropdown-menu {
            background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.16), rgba(15, 23, 42, 1));
            border: 1px solid rgba(148, 163, 184, 0.5);
            color: #e5e7eb;
        }
        
        .topbar .dropdown-item {
            color: #e5e7eb;
        }
        
        .topbar .dropdown-item:hover {
            background: rgba(15, 23, 42, 0.9);
            color: #e5e7eb;
        }
        
        .card {
            background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.12), rgba(15, 23, 42, 1));
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            box-shadow: 0 18px 45px rgba(15, 23, 42, 0.9);
            margin-bottom: 1.5rem;
        }
        
        .card-header {
            background: transparent;
            color: #e5e7eb;
            font-weight: 600;
            padding: 12px 12px 10px;
            border-bottom: 1px solid rgba(51, 65, 85, 1);
        }
        
        .table {
            color: #e5e7eb;
        }
        
        .table thead th {
            background: rgba(15, 23, 42, 0.98);
            color: #6b7280;
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.16em;
            border: none;
            border-bottom: 1px solid rgba(51, 65, 85, 1);
            padding: 6px 12px;
        }
        
        .table tbody tr {
            border-bottom: 1px solid rgba(51, 65, 85, 1);
        }
        
        .table tbody tr:nth-child(even) {
            background: rgba(15, 23, 42, 0.8);
        }
        
        .table tbody tr:hover {
            background: rgba(15, 23, 42, 0.96);
            cursor: pointer;
        }
        
        .table td {
            color: #e5e7eb;
            padding: 8px 12px;
            font-size: 11px;
        }
        
        .btn {
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.6);
            background: rgba(15, 23, 42, 0.9);
            color: #e5e7eb;
            font-size: 11px;
            padding: 5px 9px;
            transition: all 0.18s ease-out;
        }
        
        .btn:hover {
            border-color: rgba(56, 189, 248, 0.9);
            background: rgba(15, 23, 42, 1);
            color: #e5e7eb;
        }
        
        .btn-primary {
            border-color: rgba(56, 189, 248, 0.9);
            background: linear-gradient(90deg, rgba(56, 189, 248, 0.3), rgba(56, 189, 248, 0.2));
        }
        
        .language-switcher {
            position: relative;
        }
        
        .language-switcher .btn {
            border-radius: 20px;
            padding: 0.5rem 1rem;
        }
        
        #theme-switch {
            height: 40px;
            width: 40px;
            padding: 0;
            border-radius: 50%;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(148, 163, 184, 0.3);
        }
        
        #theme-switch:hover {
            background-color: rgba(15, 23, 42, 0.9);
            border-color: rgba(56, 189, 248, 0.7);
        }
        
        #theme-switch svg {
            width: 24px;
            height: 24px;
            fill: #9ca3af;
        }
        
        #theme-switch svg:last-child {
            display: none;
        }
        
        .darkmode #theme-switch svg:first-child {
            display: none;
        }
        
        .darkmode #theme-switch svg:last-child {
            display: block !important;
        }
        
        .darkmode #theme-switch svg {
            fill: #e5e7eb;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(55, 65, 81, 1);
            border-radius: 999px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(75, 85, 99, 1);
        }
        
        /* Checkbox stilleri */
        .client-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        #selectAllCheckbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        #deleteSelectedBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #deleteSelectedBtn:not(:disabled):hover {
            background: rgba(239, 68, 68, 0.9) !important;
            border-color: rgba(239, 68, 68, 1) !important;
        }
    </style>
</head>

    <!-- Edit Client Modal -->
    <div class="modal fade" id="editClientModal" tabindex="-1" role="dialog" aria-labelledby="editClientModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg" role="document">
            <div class="modal-content">
                <div class="modal-header bg-warning text-white">
                    <h5 class="modal-title" id="editClientModalLabel">
                        <i class="fas fa-edit mr-2"></i>
                        Müşteri Düzenle
                    </h5>
                    <button type="button" class="close text-white" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="editClientForm">
                        <input type="hidden" id="editClientId">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="editVergiNo">
                                        <i class="fas fa-hashtag mr-2 text-primary"></i>
                                        Vergi No
                                        <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control" id="editVergiNo" placeholder="Vergi numarası girin..." required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="editUnvan">
                                        <i class="fas fa-building mr-2 text-primary"></i>
                                        Unvan
                                        <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control" id="editUnvan" placeholder="Şirket unvanı girin..." required>
                                </div>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="editVergiDairesi">
                                        <i class="fas fa-landmark mr-2 text-primary"></i>
                                        Vergi Dairesi
                                        <span class="text-danger">*</span>
                                    </label>
                                    <input type="text" class="form-control" id="editVergiDairesi" placeholder="Vergi dairesi girin..." required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-group">
                                    <label for="editEkip">
                                        <i class="fas fa-users mr-2 text-primary"></i>
                                        Ekip
                                        <span class="text-danger">*</span>
                                    </label>
                                    <select class="form-control" id="editEkip" required>
                                        <option value="">Ekip seçin...</option>
                                        <option value="B1_EDA">B1_EDA</option>
                                        <option value="B2_MAS">B2_MAS</option>
                                        <option value="B3_HAKAN">B3_HAKAN</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">
                        <i class="fas fa-times mr-2"></i>

                        Güncelle
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- SheetJS for Excel Import -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <!-- Supabase Config & JS -->
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Authentication System -->
    <script src="auth.js"></script>
    <!-- Dark Mode -->
    <link rel="stylesheet" href="darkmode.css">
    <!-- Logout Button -->
    <link rel="stylesheet" href="logout-button.css">
    <script>
        // Initialize dark mode IMMEDIATELY before page renders to prevent flash
        (function() {
            const darkmode = localStorage.getItem('darkmode');
            if (darkmode === "active") {
                document.documentElement.classList.add('darkmode');
                document.body.classList.add('darkmode');
            }
        })();
    </script>
    <script src="darkmode.js" defer></script>
    <script src="logout-button.js" defer></script>
    <script>
        // Check authentication on page load (DOMContentLoaded ile geciktir)
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                if (typeof Auth !== 'undefined' && !Auth.isAuthenticated()) {
            window.location.href = 'login.html';
        }
            }, 100);
        });
        
        // Update user info in topbar
        const currentUser = Auth.getCurrentUser();
        if (currentUser) {
            const userEmail = currentUser.username || currentUser.email || currentUser.fullName || currentUser.full_name;
            $('#userEmail').text(userEmail);
        }
        
        // Get Supabase client from auth.js
        function getSupabaseClient() {
            // Check if supabaseClient is available from auth.js
            if (typeof supabaseClient !== 'undefined' && supabaseClient) {
                return supabaseClient;
            }
            // Fallback: Try to create client if available
            if (typeof window.supabase !== 'undefined') {
                const SUPABASE_URL = window.SUPABASE_URL || 'YOUR_SUPABASE_URL';
                const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || 'YOUR_SUPABASE_ANON_KEY';
                if (!SUPABASE_URL.includes('YOUR_') && !SUPABASE_ANON_KEY.includes('YOUR_')) {
                    return window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                }
            }
            return null;
        }
        
        // Client Management Functions with Supabase
        async function getClientsFromSupabase() {
            const supabase = getSupabaseClient();
            if (!supabase) {
                // Fallback to localStorage if Supabase not available
                const clients = localStorage.getItem('clients');
                return clients ? JSON.parse(clients) : [];
            }
            
            try {
                const { data, error } = await supabase
                    .from('clients')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) {
                    console.error('Supabase error:', error);
                    // Fallback to localStorage
                    const clients = localStorage.getItem('clients');
                    return clients ? JSON.parse(clients) : [];
                }
                
                return data || [];
            } catch (error) {
                console.error('Error fetching clients:', error);
                // Fallback to localStorage
                const clients = localStorage.getItem('clients');
                return clients ? JSON.parse(clients) : [];
            }
        }
        
        async function addClientToSupabase(client) {
            const supabase = getSupabaseClient();
            if (!supabase) {
                // Fallback to localStorage
                const clients = JSON.parse(localStorage.getItem('clients') || '[]');
                clients.push(client);
                localStorage.setItem('clients', JSON.stringify(clients));
                return { success: true, data: client };
            }
            
            try {
                const { data, error } = await supabase
                    .from('clients')
                    .insert([{
                        vergi_no: client.vergiNo,
                        unvan: client.unvan,
                        vergi_dairesi: client.vergiDairesi,
                        ekip: client.ekip
                    }])
                    .select()
                    .single();
                
                if (error) {
                    console.error('Supabase insert error:', error);
                    throw error;
                }
                
                return { success: true, data: data };
            } catch (error) {
                console.error('Error adding client:', error);
                throw error;
            }
        }
        
        async function updateClientInSupabase(id, client) {
            const supabase = getSupabaseClient();
            if (!supabase) {
                // Fallback to localStorage
                const clients = JSON.parse(localStorage.getItem('clients') || '[]');
                if (clients[id - 1]) {
                    clients[id - 1] = client;
                    localStorage.setItem('clients', JSON.stringify(clients));
                }
                return { success: true };
            }
            
            try {
                // Get all clients to find the UUID
                const { data: allClients, error: fetchError } = await supabase
                    .from('clients')
                    .select('id')
                    .order('created_at', { ascending: false });
                
                if (fetchError) throw fetchError;
                
                const clientToUpdate = allClients[id - 1];
                if (!clientToUpdate) {
                    throw new Error('Client not found');
                }
                
                const { error } = await supabase
                    .from('clients')
                    .update({
                        vergi_no: client.vergiNo,
                        unvan: client.unvan,
                        vergi_dairesi: client.vergiDairesi,
                        ekip: client.ekip
                    })
                    .eq('id', clientToUpdate.id);
                
                if (error) throw error;
                
                return { success: true };
            } catch (error) {
                console.error('Error updating client:', error);
                throw error;
            }
        }
        
        async function deleteClientFromSupabase(id) {
            const supabase = getSupabaseClient();
            if (!supabase) {
                // Fallback to localStorage
                const clients = JSON.parse(localStorage.getItem('clients') || '[]');
                if (clients[id - 1]) {
                    clients.splice(id - 1, 1);
                    localStorage.setItem('clients', JSON.stringify(clients));
                }
                return { success: true };
            }
            
            try {
                // Get all clients to find the UUID
                const { data: allClients, error: fetchError } = await supabase
                    .from('clients')
                    .select('id')
                    .order('created_at', { ascending: false });
                
                if (fetchError) throw fetchError;
                
                const clientToDelete = allClients[id - 1];
                if (!clientToDelete) {
                    throw new Error('Client not found');
                }
                
                const { error } = await supabase
                    .from('clients')
                    .delete()
                    .eq('id', clientToDelete.id);
                
                if (error) throw error;
                
                return { success: true };
            } catch (error) {
                console.error('Error deleting client:', error);
                throw error;
            }
        }
        
        async function renderClientsFromSupabase() {
            const clients = await getClientsFromSupabase();
            const tbody = document.querySelector('#tablebot tbody');
            tbody.innerHTML = '';
            
            clients.forEach((client, index) => {
                const id = index + 1;
                const clientId = client.id || client.vergi_no || index; // Supabase UUID veya fallback
                const tr = document.createElement('tr');
                tr.className = 'listeEleman';
                tr.setAttribute('data-client-id', clientId);
                tr.style.cursor = 'pointer';
                
                // Handle both Supabase format (vergi_no) and localStorage format (vergiNo)
                const vergiNo = client.vergi_no || client.vergiNo || '';
                const unvan = client.unvan || '';
                const vergiDairesi = client.vergi_dairesi || client.vergiDairesi || '';
                const ekip = client.ekip || '';
                
                tr.innerHTML = `
                    <td class="text-center align-middle" onclick="event.stopPropagation();">
                        <input type="checkbox" class="client-checkbox" data-client-id="${clientId}" data-index="${index}" onchange="updateDeleteButtonState()" style="cursor: pointer;">
                    </td>
                    <td class="text-center align-middle">${vergiNo}</td>
                    <td class="text-left align-middle">${unvan}</td>
                    <td class="text-center align-middle">${vergiDairesi}</td>
                    <td class="text-center align-middle">${ekip}</td>
                    <td class="text-center align-middle" onclick="event.stopPropagation();">
                        <button onclick="editClient(${id}, '${vergiNo.replace(/'/g, "\\'")}', '${unvan.replace(/'/g, "\\'")}', '${vergiDairesi.replace(/'/g, "\\'")}', '${ekip.replace(/'/g, "\\'")}', event)" class="btn btn-warning btn-sm mb-1" style="width: 90px;">
                            <i class="fa fa-edit"></i> Düzenle
                        </button><br>
                        <button onclick="deleteClient(${id}, event)" class="btn btn-danger btn-sm" style="width: 90px;">
                            <i class="fa fa-trash"></i> Sil
                        </button>
                    </td>
                `;
                
                // Row click handler (checkbox ve button'lar hariç)
                tr.onclick = function(e) {
                    if (e.target.type !== 'checkbox' && !e.target.closest('button')) {
                        window.location.href = 'client-detail.html?id=' + id;
                    }
                };
                
                tbody.appendChild(tr);
            });
            
            // Reset select all checkbox
            document.getElementById('selectAllCheckbox').checked = false;
            updateDeleteButtonState();
        }
        
        // Toplu seçim/silme fonksiyonları
        function toggleSelectAll() {
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            const checkboxes = document.querySelectorAll('.client-checkbox');
            const isChecked = selectAllCheckbox.checked;
            
            checkboxes.forEach(checkbox => {
                checkbox.checked = isChecked;
            });
            
            document.getElementById('selectAllText').textContent = isChecked ? 'Seçimi Kaldır' : 'Tümünü Seç';
            updateDeleteButtonState();
        }
        
        function updateDeleteButtonState() {
            const checkboxes = document.querySelectorAll('.client-checkbox:checked');
            const deleteBtn = document.getElementById('deleteSelectedBtn');
            
            if (checkboxes.length > 0) {
                deleteBtn.disabled = false;
                deleteBtn.innerHTML = `<i class="fa fa-trash"></i> Seçilenleri Sil (${checkboxes.length})`;
            } else {
                deleteBtn.disabled = true;
                deleteBtn.innerHTML = '<i class="fa fa-trash"></i> Seçilenleri Sil';
            }
            
            // Select all checkbox durumunu güncelle
            const allCheckboxes = document.querySelectorAll('.client-checkbox');
            const checkedCount = document.querySelectorAll('.client-checkbox:checked').length;
            const selectAllCheckbox = document.getElementById('selectAllCheckbox');
            
            if (allCheckboxes.length === 0) {
                selectAllCheckbox.checked = false;
            } else {
                selectAllCheckbox.checked = checkedCount === allCheckboxes.length;
            }
            
            document.getElementById('selectAllText').textContent = selectAllCheckbox.checked ? 'Seçimi Kaldır' : 'Tümünü Seç';
        }
        
        async function deleteSelectedClients() {
            const checkboxes = document.querySelectorAll('.client-checkbox:checked');
            
            if (checkboxes.length === 0) {
                alert('Lütfen silmek için en az bir müşteri seçin!');
                return;
            }
            
            const confirmMessage = `${checkboxes.length} müşteriyi silmek istediğinizden emin misiniz?`;
            if (!confirm(confirmMessage)) {
                return;
            }
            
            try {
                const supabase = getSupabaseClient();
                const clients = await getClientsFromSupabase();
                const selectedIndices = Array.from(checkboxes).map(cb => parseInt(cb.getAttribute('data-index')));
                
                // Seçili client'ları sil
                if (supabase) {
                    // Supabase'den toplu silme
                    const selectedClients = selectedIndices
                        .map(index => clients[index])
                        .filter(client => client && client.id);
                    
                    if (selectedClients.length > 0) {
                        const selectedClientIds = selectedClients.map(client => client.id);
                        const { error } = await supabase
                            .from('clients')
                            .delete()
                            .in('id', selectedClientIds);
                        
                        if (error) throw error;
                    }
                    
                    // localStorage fallback için de sil
                    const localStorageClients = JSON.parse(localStorage.getItem('clients') || '[]');
                    const filteredClients = localStorageClients.filter((_, index) => !selectedIndices.includes(index));
                    localStorage.setItem('clients', JSON.stringify(filteredClients));
                } else {
                    // Sadece localStorage
                    const localStorageClients = JSON.parse(localStorage.getItem('clients') || '[]');
                    const filteredClients = localStorageClients.filter((_, index) => !selectedIndices.includes(index));
                    localStorage.setItem('clients', JSON.stringify(filteredClients));
                }
                
                // Tabloyu yeniden render et
                await renderClientsFromSupabase();
                
                alert(`${checkboxes.length} müşteri başarıyla silindi!`);
            } catch (error) {
                console.error('Error deleting clients:', error);
                alert('Müşteriler silinirken bir hata oluştu. Lütfen tekrar deneyin.');
            }
        }
        
        // Load clients from Supabase on page load
        $(document).ready(function() {
            renderClientsFromSupabase();
        });
        
        // Tablo arama fonksiyonu
        $(document).ready(function() {
            $("#search").on("keyup", function() {
                var value = $(this).val().toLowerCase();
                $("#tablebot tbody tr").filter(function() {
                    if ($(this).text().toLowerCase().indexOf(value) > -1) {
                        $(this).toggle(true);
                    } else {
                        $(this).toggle(false);
                    }
                });
            });
            
            // Tablo sıralama (checkbox sütunu hariç)
            $("#tablebot th").each(function (col) {
                // İlk sütun (checkbox) için sıralama yapma
                if (col === 0) return;
                
                $(this).click(function () {
                    // Checkbox sütununa tıklanırsa sıralama yapma
                    if ($(this).find('input[type="checkbox"]').length > 0) return;
                    
                    $("#tablebot th i").remove();
                    var sortOrder = $(this).hasClass('asc') ? -1 : 1;
                    $(this).removeClass('asc desc');
                    $(this).addClass(sortOrder === 1 ? 'asc' : 'desc');
                    $(this).append('<i class="fa fa-sort-' + (sortOrder === 1 ? 'asc' : 'desc') + '" aria-hidden="true"/>');
                    $(this).siblings().removeClass('asc desc');
                    
                    var arrData = $("#tablebot").find('tbody >tr:has(td)').get();
                    arrData.sort(function (a, b) {
                        var val1 = $(a).children('td').eq(col).text().toUpperCase();
                        var val2 = $(b).children('td').eq(col).text().toUpperCase();
                        if ($.isNumeric(val1) && $.isNumeric(val2))
                            return sortOrder === 1 ? val1 - val2 : val2 - val1;
                        else
                            return (val1 < val2) ? -sortOrder : (val1 > val2) ? sortOrder : 0;
                    });
                    $.each(arrData, function (index, row) {
                        $("#tablebot tbody").append(row);
                    });
                });
            });
        });
        
        // Excel Import
        document.getElementById('excelFile').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    
                    // İlk sayfayı al
                    const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                    
                    // JSON'a çevir
                    const jsonData = XLSX.utils.sheet_to_json(firstSheet, {header: 1});
                    
                    if (jsonData.length < 2) {
                        alert('Excel dosyası boş veya geçersiz!');
                        return;
                    }
                    
                    // Excel'den client'ları parse et
                    const newClients = [];
                    
                    // İlk satır başlık olduğu için 1'den başla
                    for (let i = 1; i < jsonData.length; i++) {
                        const row = jsonData[i];
                        
                        // Boş satırları atla
                        if (!row[0] && !row[1]) continue;
                        
                        const client = {
                            vergiNo: (row[0] || '').toString(),
                            unvan: (row[1] || '').toString(),
                            vergiDairesi: (row[2] || '').toString(),
                            ekip: (row[3] || '').toString()
                        };
                        
                        newClients.push(client);
                    }
                    
                    // Supabase'e ekle
                    const supabase = getSupabaseClient();
                    if (supabase) {
                        try {
                            // Batch insert to Supabase
                            const clientsToInsert = newClients.map(client => ({
                                vergi_no: client.vergiNo,
                                unvan: client.unvan,
                                vergi_dairesi: client.vergiDairesi,
                                ekip: client.ekip
                            }));
                            
                            const { data, error } = await supabase
                                .from('clients')
                                .insert(clientsToInsert)
                                .select();
                            
                            if (error) {
                                console.error('Supabase batch insert error:', error);
                                throw error;
                            }
                            
                            // Tabloyu yeniden render et
                            await renderClientsFromSupabase();
                            
                            alert(`${newClients.length} müşteri başarıyla içe aktarıldı ve Supabase'e kaydedildi!`);
                        } catch (error) {
                            console.error('Error importing to Supabase:', error);
                            alert('Supabase\'e kaydedilirken bir hata oluştu. Veriler localStorage\'a kaydedildi.');
                            // Fallback to localStorage
                            const existingClients = JSON.parse(localStorage.getItem('clients') || '[]');
                            const allClients = [...existingClients, ...newClients];
                            localStorage.setItem('clients', JSON.stringify(allClients));
                            await renderClientsFromSupabase();
                        }
                    } else {
                        // Fallback to localStorage
                        const existingClients = JSON.parse(localStorage.getItem('clients') || '[]');
                        const allClients = [...existingClients, ...newClients];
                        localStorage.setItem('clients', JSON.stringify(allClients));
                        await renderClientsFromSupabase();
                        alert(`${newClients.length} müşteri başarıyla içe aktarıldı ve localStorage'a kaydedildi!`);
                    }
                    
                    // Input'u sıfırla
                    e.target.value = '';
                    
                } catch (error) {
                    console.error('Excel okuma hatası:', error);
                    alert('Excel dosyası okunurken bir hata oluştu. Lütfen dosya formatını kontrol edin.');
                }
            };
            
            reader.readAsArrayBuffer(file);
        });
        
        // Edit client
        function editClient(id, vergiNo, unvan, vergiDairesi, ekip, event) {
            if (event) {
                event.stopPropagation();
            }
            
            document.getElementById('editClientId').value = id;
            document.getElementById('editVergiNo').value = vergiNo;
            document.getElementById('editUnvan').value = unvan;
            document.getElementById('editVergiDairesi').value = vergiDairesi;
            document.getElementById('editEkip').value = ekip;
            
            $('#editClientModal').modal('show');
        }
        
        // Save edited client
        async function saveEditClient() {
            const id = parseInt(document.getElementById('editClientId').value);
            const vergiNo = document.getElementById('editVergiNo').value.trim();
            const unvan = document.getElementById('editUnvan').value.trim();
            const vergiDairesi = document.getElementById('editVergiDairesi').value.trim();
            const ekip = document.getElementById('editEkip').value.trim();
            
            if (!vergiNo || !unvan || !vergiDairesi || !ekip) {
                alert('Lütfen tüm alanları doldurun!');
                return;
            }
            
            // Client objesi oluştur
            const client = {
                vergiNo: vergiNo,
                unvan: unvan,
                vergiDairesi: vergiDairesi,
                ekip: ekip
            };
            
            try {
                // Supabase'e kaydet
                await updateClientInSupabase(id, client);
                
                // Tabloyu yeniden render et
                await renderClientsFromSupabase();
            
            // Modal'ı kapat
            $('#editClientModal').modal('hide');
            
                alert('Müşteri başarıyla güncellendi ve Supabase\'e kaydedildi!');
            } catch (error) {
                console.error('Error saving client:', error);
                alert('Müşteri güncellenirken bir hata oluştu. Lütfen tekrar deneyin.');
            }
        }
        
        // Delete client
        async function deleteClient(id, event) {
            if (event) {
                event.stopPropagation();
            }
            
            if (confirm('Bu müşteriyi silmek istediğinizden emin misiniz?')) {
                try {
                    // Supabase'den sil
                    await deleteClientFromSupabase(id);
                    
                    // Tabloyu yeniden render et
                    await renderClientsFromSupabase();
                    
                        alert('Müşteri başarıyla silindi!');
                } catch (error) {
                    console.error('Error deleting client:', error);
                    alert('Müşteri silinirken bir hata oluştu. Lütfen tekrar deneyin.');
                    }
            }
        }
        
        // Save new client
        async function saveNewClient() {
            const vergiNo = document.getElementById('newVergiNo').value.trim();
            const unvan = document.getElementById('newUnvan').value.trim();
            const vergiDairesi = document.getElementById('newVergiDairesi').value.trim();
            const ekip = document.getElementById('newEkip').value.trim();
            
            if (!vergiNo || !unvan || !vergiDairesi || !ekip) {
                alert('Lütfen tüm alanları doldurun!');
                return;
            }
            
            // Client objesi oluştur
            const client = {
                vergiNo: vergiNo,
                unvan: unvan,
                vergiDairesi: vergiDairesi,
                ekip: ekip
            };
            
            try {
                // Supabase'e kaydet
                await addClientToSupabase(client);
                
                // Tabloyu yeniden render et
                await renderClientsFromSupabase();
            
            // Modal'ı kapat
            $('#addClientModal').modal('hide');
            
            // Formu temizle
            document.getElementById('addClientForm').reset();
            
                alert('Müşteri başarıyla eklendi ve Supabase\'e kaydedildi!');
            } catch (error) {
                console.error('Error adding client:', error);
                alert('Müşteri eklenirken bir hata oluştu. Lütfen tekrar deneyin.');
            }
        }
    </script>
