<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="Crowe HSY - Users">
    <meta name="author" content="">
    <title>CROWE HSY - Users</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">
    
    <style>
        body {
            background-color: #f8f9fc;
            font-family: 'Nunito', sans-serif;
        }
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            padding: 48px 0 0;
            box-shadow: inset -1px 0 0 rgba(0, 0, 0, .1);
            background: #002060;
            color: white;
            width: 224px;
        }
        .sidebar-brand {
            font-size: 1.5rem;
            font-weight: 800;
            padding: 1.5rem 1rem;
            text-align: center;
            color: white;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .sidebar-brand img {
            display: block;
            margin: 0 auto;
            width: 80px;
            height: 80px;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,.8);
            padding: 1rem;
            font-weight: 500;
        }
        .sidebar .nav-link:hover, .sidebar .nav-link.active {
            color: rgba(255,255,255,1);
            background-color: rgba(255,255,255,.1);
        }
        .sidebar .nav-link i {
            margin-right: 0.5rem;
            width: 1.5rem;
        }
        #content-wrapper {
            margin-left: 224px;
            width: calc(100% - 224px);
        }
        .topbar {
            background-color: white;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, .15);
            padding: 1rem 1.5rem;
        }
        .card {
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, .15);
            border: none;
            margin-bottom: 1.5rem;
        }
        .card-header {
            background: #002060;
            color: white;
            font-weight: 600;
            padding: 1rem 1.5rem;
        }
        .table thead th {
            background-color: #5a5c69;
            color: white;
            font-weight: 600;
            border: none;
        }
        .table tbody tr:hover {
            background-color: #f8f9fc;
        }
        .language-switcher {
            position: relative;
        }
        .language-switcher .btn {
            border-radius: 20px;
            padding: 0.5rem 1rem;
        }
        #theme-switch {
            height: 40px;
            width: 40px;
            padding: 0;
            border-radius: 50%;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #theme-switch:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }
        #theme-switch svg {
            width: 24px;
            height: 24px;
        }
        #theme-switch svg:last-child {
            display: none;
        }
        .darkmode #theme-switch svg:first-child {
            display: none;
        }
        .darkmode #theme-switch svg:last-child {
            display: block !important;
        }
        .darkmode #theme-switch svg {
            fill: #ffffff;
        }
        .badge-online {
            background-color: #1cc88a;
            color: white;
        }
        .badge-offline {
            background-color: #858796;
            color: white;
        }
    </style>
</head>
<body id="page-top">
    <div id="wrapper">
        <!-- Sidebar -->
        <ul class="sidebar" id="accordionSidebar">
            <a class="sidebar-brand" href="index.html">
                <img src="logo.svg" alt="Crowe HSY Logo">
            </a>
            <hr class="sidebar-divider my-0">
            <li class="nav-item">
                <a class="nav-link" href="dashboard.html">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="client-list.html">
                    <i class="fas fa-building"></i>
                    <span>Müşteriler</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="payments.html">
                    <i class="fas fa-money-bill-wave"></i>
                    <span>Gelen Ödemeler</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="reports.html">
                    <i class="fas fa-file-alt"></i>
                    <span>Raporlar</span>
                </a>
            </li>
        </ul>

        <!-- Content Wrapper -->
        <div id="content-wrapper">
            <!-- Topbar -->
            <nav class="navbar navbar-expand navbar-light topbar mb-4 static-top shadow">
                <button class="btn btn-link d-md-none rounded-circle mr-3" id="sidebarToggle">
                    <i class="fa fa-bars"></i>
                </button>
                <ul class="navbar-nav ml-auto">
                    <!-- Language Switcher -->
                    <li class="nav-item language-switcher mr-3">
                        <button class="btn btn-sm btn-outline-primary" id="langSwitch" onclick="toggleLanguage()">
                            <i class="fas fa-globe"></i> <span id="langText">TR</span>
                        </button>
                    </li>
                    <li class="nav-item dropdown no-arrow" style="margin-right: 1rem;">
                        <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            <span class="mr-2 d-none d-lg-inline text-gray-600 small" id="userEmail">Admin</span>
                        </a>
                        <div class="dropdown-menu dropdown-menu-right shadow">
                            <a class="dropdown-item" href="#">
                                <i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i>
                                Profil
                            </a>
                            <div class="dropdown-divider"></div>
                        </div>
                    </li>
                    <li class="nav-item" style="margin-right: 1rem;">
                        <a class="nav-link" href="#" onclick="Auth.logout(); return false;" style="cursor: pointer;">
                            <i class="fas fa-sign-out-alt mr-2"></i>
                            <span class="d-none d-lg-inline">Çıkış</span>
                        </a>
                    </li>
                    <!-- Dark Mode Switcher -->
                    <li class="nav-item">
                        <button id="theme-switch" aria-label="Switch to dark mode" style="border: none; background: transparent; padding: 0; cursor: pointer; margin-left: 0.5rem;">
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" style="fill: #5a5c69;">
                                <path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/>
                            </svg>
                            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" style="fill: #5a5c69; display: none;">
                                <path d="M480-280q-83 0-141.5-58.5T280-480q0-83 58.5-141.5T480-680q83 0 141.5 58.5T680-480q0 83-58.5 141.5T480-280ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Z"/>
                            </svg>
                        </button>
                    </li>
                </ul>
            </nav>

            <!-- Main Content -->
            <div class="container-fluid">
                <div class="card shadow mb-4">
                    <div class="card-header py-3 d-flex justify-content-between align-items-center">
                        <h6 class="m-0 font-weight-bold text-white">Toplam Kullanıcı Sayısı: <span id="totalUsers">924</span></h6>
                        <div>
                            <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Kullanıcı ara..." style="display: inline-block; width: 200px;">
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-bordered" id="usersTable" width="100%" cellspacing="0">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Ad Soyad</th>
                                        <th>Kullanıcı Adı</th>
                                        <th>E-posta</th>
                                        <th>Rol</th>
                                        <th>Durum</th>
                                        <th>Kayıt Tarihi</th>
                                        <th>İşlemler</th>
                                    </tr>
                                </thead>
                                <tbody id="usersTableBody">
                                    <!-- Data will be populated by JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Supabase Config & JS -->
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Authentication System -->
    <script src="auth.js"></script>
    <!-- Dark Mode -->
    <link rel="stylesheet" href="darkmode.css">
    <script src="darkmode.js" defer></script>
    <!-- Prevent Active Link Reload -->
    <script src="prevent-active-link-reload.js"></script>
    <script>
        // Check authentication on page load (DOMContentLoaded ile geciktir)
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                if (typeof Auth !== 'undefined' && !Auth.isAuthenticated()) {
                    window.location.href = 'login.html';
                }
            }, 100);
        });
        
        // Update user info in topbar (same as other pages)
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const currentUser = Auth.getCurrentUser();
                if (currentUser) {
                    // username field contains the email address
                    const userEmail = currentUser.username || currentUser.email || currentUser.fullName || currentUser.full_name;
                    const userEmailElement = document.getElementById('userEmail');
                    if (userEmailElement) {
                        userEmailElement.textContent = userEmail;
                    }
                }
            }, 100);
        });
        
        // Also update immediately if DOM is already loaded
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(function() {
                const currentUser = Auth.getCurrentUser();
                if (currentUser) {
                    const userEmail = currentUser.username || currentUser.email || currentUser.fullName || currentUser.full_name;
                    const userEmailElement = document.getElementById('userEmail');
                    if (userEmailElement) {
                        userEmailElement.textContent = userEmail;
                    }
                }
            }, 100);
        }
        
        function toggleLanguage() {
            const currentLang = i18n.currentLang;
            const newLang = currentLang === 'en' ? 'tr' : 'en';
            i18n.setLanguage(newLang);
            document.getElementById('langText').textContent = newLang === 'en' ? 'TR' : 'EN';
        }
        
        // Sample user data
        const usersData = [
            { id: 1, fullName: 'Eda Meric Sefer', username: 'eda.meric', email: 'eda.meric@crowehsy.com', role: 'Admin', status: 'online', registerDate: '2023-01-15' },
            { id: 2, fullName: 'Ozkan Cengiz', username: 'ozkan.cengiz', email: 'ozkan.cengiz@crowehsy.com', role: 'Admin', status: 'online', registerDate: '2023-02-20' },
            { id: 3, fullName: 'Mehmet Ali Sariad', username: 'mehmet.sariad', email: 'mehmet.sariad@crowehsy.com', role: 'Admin', status: 'offline', registerDate: '2023-03-10' },
            { id: 4, fullName: 'Mert Cengiz', username: 'mert.cengiz', email: 'mert.cengiz@crowehsy.com', role: 'Admin', status: 'online', registerDate: '2023-04-05' },
            { id: 5, fullName: 'Ahmet Yılmaz', username: 'ahmet.yilmaz', email: 'ahmet.yilmaz@crowehsy.com', role: 'Employee', status: 'offline', registerDate: '2023-05-12' },
            { id: 6, fullName: 'Ayşe Demir', username: 'ayse.demir', email: 'ayse.demir@crowehsy.com', role: 'Employee', status: 'online', registerDate: '2023-06-18' },
            // Add more sample users...
        ];
        
        // Populate table
        function populateTable(users) {
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';
            
            users.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.fullName}</td>
                    <td>${user.username}</td>
                    <td>${user.email}</td>
                    <td><span class="badge badge-${user.role === 'Admin' ? 'primary' : 'secondary'}">${user.role}</span></td>
                    <td><span class="badge badge-${user.status === 'online' ? 'online' : 'offline'}">${user.status === 'online' ? 'Çevrimiçi' : 'Çevrimdışı'}</span></td>
                    <td>${user.registerDate}</td>
                    <td>
                        <button class="btn btn-sm btn-info" onclick="viewUserDetails(${user.id})">
                            <i class="fas fa-eye"></i> Detay
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
            
            document.getElementById('totalUsers').textContent = users.length;
        }
        
        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const filteredUsers = usersData.filter(user => 
                user.fullName.toLowerCase().includes(searchTerm) ||
                user.username.toLowerCase().includes(searchTerm) ||
                user.email.toLowerCase().includes(searchTerm)
            );
            populateTable(filteredUsers);
        });
        
        // View user details
        function viewUserDetails(userId) {
            const user = usersData.find(u => u.id === userId);
            if (user) {
                alert(`Kullanıcı Detayları:\n\nAd Soyad: ${user.fullName}\nKullanıcı Adı: ${user.username}\nE-posta: ${user.email}\nRol: ${user.role}\nDurum: ${user.status === 'online' ? 'Çevrimiçi' : 'Çevrimdışı'}\nKayıt Tarihi: ${user.registerDate}`);
            }
        }
        
        // Initialize table
        populateTable(usersData);
        
        // Update language switcher text on language change
        document.addEventListener('languageChanged', function() {
            document.getElementById('langText').textContent = i18n.currentLang === 'en' ? 'TR' : 'EN';
        });
    </script>
</body>
</html>
