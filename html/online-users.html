        }
        #theme-switch svg {
            width: 24px;
            height: 24px;
        }
        #theme-switch svg:last-child {
            display: none;
        }
        .darkmode #theme-switch svg:first-child {
            display: none;
        }
        .darkmode #theme-switch svg:last-child {
            display: block !important;
        }
        .darkmode #theme-switch svg {
            fill: #ffffff;
        }
        .badge-online {
            background-color: #1cc88a;
            color: white;
        }
        .file-icon {
            font-size: 1.2rem;
            margin-right: 0.3rem;
        }
        .online-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #1cc88a;
            display: inline-block;
            margin-right: 0.5rem;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(28, 200, 138, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(28, 200, 138, 0); }
            100% { box-shadow: 0 0 0 0 rgba(28, 200, 138, 0); }
        }
    </style>
</head>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Supabase Config & JS -->
    <script src="supabase-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Authentication System -->

    <!-- Dark Mode -->

    <!-- Prevent Active Link Reload -->

    <script>
        // Check authentication on page load (DOMContentLoaded ile geciktir)
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                if (typeof Auth !== 'undefined' && !Auth.isAuthenticated()) {
                    window.location.href = 'login.html';
                }
            }, 100);
        });
        
        // Update user info in topbar (same as other pages)
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const currentUser = Auth.getCurrentUser();
                if (currentUser) {
                    // username field contains the email address
                    const userEmail = currentUser.username || currentUser.email || currentUser.fullName || currentUser.full_name;
                    const userEmailElement = document.getElementById('userEmail');
                    if (userEmailElement) {
                        userEmailElement.textContent = userEmail;
                    }
                }
            }, 100);
        });
        
        // Also update immediately if DOM is already loaded
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(function() {
                const currentUser = Auth.getCurrentUser();
                if (currentUser) {
                    const userEmail = currentUser.username || currentUser.email || currentUser.fullName || currentUser.full_name;
                    const userEmailElement = document.getElementById('userEmail');
                    if (userEmailElement) {
                        userEmailElement.textContent = userEmail;
                    }
                }
            }, 100);
        }
        
        // Get Supabase client helper function
        function getSupabaseClient() {
            if (typeof window.supabase !== 'undefined' && window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
                if (!window.SUPABASE_URL.includes('YOUR_') && !window.SUPABASE_ANON_KEY.includes('YOUR_')) {
                    return window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
                }
            }
            return null;
        }
        
        // Supabase functions for online sessions
        async function getOnlineSessionsFromSupabase() {
            const supabase = getSupabaseClient();
            if (!supabase) {
                return onlineUsersData; // Fallback to static data
            }
            
            try {
                const { data, error } = await supabase
                    .from('online_sessions')
                    .select('*')
                    .eq('is_active', true)
                    .order('last_activity', { ascending: false });
                
                if (error) {
                    console.error('Supabase error:', error);
                    return onlineUsersData; // Fallback to static data
                }
                
                // Convert Supabase format to local format
                return (data || []).map(s => {
                    const sessionStart = new Date(s.session_start);
                    const now = new Date();
                    const diffMs = now - sessionStart;
                    const diffHours = Math.floor(diffMs / (1000 * 60 * 60));
                    const diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
                    const onlineTime = diffHours > 0 
                        ? `${diffHours} saat ${diffMins} dakika`
                        : `${diffMins} dakika`;
                    
                    return {
                        id: s.id,
                        fullName: s.full_name || s.user_email,
                        onlineTime: onlineTime,
                        activeFiles: s.active_files || []
                    };
                });
            } catch (error) {
                console.error('Error fetching online sessions:', error);
                return onlineUsersData; // Fallback to static data
            }
        }
        
        function toggleLanguage() {
            const currentLang = i18n.currentLang;
            const newLang = currentLang === 'en' ? 'tr' : 'en';
            i18n.setLanguage(newLang);
            document.getElementById('langText').textContent = newLang === 'en' ? 'TR' : 'EN';
        }
        
        // Sample online users data (fallback)
        let onlineUsersData = [
            { 
                id: 1, 
                fullName: 'Eda Meric Sefer', 
                onlineTime: '2 saat 15 dakika',
                activeFiles: [
                    { name: 'rapor_2024.xlsx', type: 'excel' },
                    { name: 'sözlesme_abc.docx', type: 'word' },
                    { name: 'fatura_001.pdf', type: 'pdf' },
                    { name: 'sirket_verileri.xlsx', type: 'excel' }
                ]
            },
            { 
                id: 2, 
                fullName: 'Ozkan Cengiz', 
                onlineTime: '1 saat 30 dakika',
                activeFiles: [
                    { name: 'denetim_raporu.docx', type: 'word' },
                    { name: 'mali_tablo.xlsx', type: 'excel' },
                    { name: 'teklif_002.pdf', type: 'pdf' }
                ]
            },
            { 
                id: 3, 
                fullName: 'Mert Cengiz', 
                onlineTime: '45 dakika',
                activeFiles: [
                    { name: 'sirket_bilgileri.xlsx', type: 'excel' },
                    { name: 'sozlesme_xyz.pdf', type: 'pdf' },
                    { name: 'toplantı_notları.docx', type: 'word' }
                ]
            },
            { 
                id: 4, 
                fullName: 'Ayşe Demir', 
                onlineTime: '3 saat 20 dakika',
                activeFiles: [
                    { name: 'muhasebe_2024.xlsx', type: 'excel' },
                    { name: 'rapor.docx', type: 'word' }
                ]
            },
            // Add more sample online users...
        ];
        
        // Get file icon class
        function getFileIconClass(fileType) {
            switch(fileType) {
                case 'excel':
                    return 'fas fa-file-excel text-success';
                case 'word':
                    return 'fas fa-file-word text-primary';
                case 'pdf':
                    return 'fas fa-file-pdf text-danger';
                default:
                    return 'fas fa-file';
            }
        }
        
        // Populate table
        function populateTable(users) {
            const tbody = document.getElementById('onlineUsersTableBody');
            tbody.innerHTML = '';
            
            users.forEach(user => {
                const row = document.createElement('tr');
                const filesHtml = user.activeFiles.map(file => 
                    `<span class="badge badge-light mr-1 mb-1">
                        <i class="${getFileIconClass(file.type)} file-icon"></i> ${file.name}
                    </span>`
                ).join('');
                
                row.innerHTML = `
                    <td>
                        <span class="online-indicator"></span>
                        ${user.fullName}
                    </td>
                    <td>${user.onlineTime}</td>
                    <td>${filesHtml || 'Aktif dosya yok'}</td>
                    <td>
                        <button class="btn btn-sm btn-info" onclick="viewUserDetails(${user.id})">
                            <i class="fas fa-eye"></i> Detay
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
            
            document.getElementById('onlineUsersCount').textContent = users.length;
        }
        
        // Search functionality
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const filteredUsers = onlineUsersData.filter(user => 
                user.fullName.toLowerCase().includes(searchTerm)
            );
            populateTable(filteredUsers);
        });
        
        // View user details
        function viewUserDetails(userId) {
            const user = onlineUsersData.find(u => u.id === userId);
            if (user) {
                const filesList = user.activeFiles.map(file => 
                    `- ${file.name} (${file.type.toUpperCase()})`
                ).join('\n');
                
                alert(`Kullanıcı Detayları:\n\nAd Soyad: ${user.fullName}\nÇevrimiçi Süre: ${user.onlineTime}\n\nAktif Dosyalar:\n${filesList || 'Aktif dosya yok'}`);
            }
        }
        
        // Initialize table
        async function initOnlineUsers() {
            onlineUsersData = await getOnlineSessionsFromSupabase();
            populateTable(onlineUsersData);
        }
        initOnlineUsers();
        
        // Update online time every minute
        setInterval(async function() {
            onlineUsersData = await getOnlineSessionsFromSupabase();
            populateTable(onlineUsersData);
        }, 60000);
        
        // Update language switcher text on language change
        document.addEventListener('languageChanged', function() {
            document.getElementById('langText').textContent = i18n.currentLang === 'en' ? 'TR' : 'EN';
        });
    </script>
