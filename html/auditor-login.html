    <!-- Three.js Galaxy Animation -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!window.THREE) {
                console.error('Three.js yüklenemedi');
                return;
            }

            const canvas = document.querySelector('canvas.webgl');
            const scene = new THREE.Scene();

            const parameters = {
                count: 80000,
                size: 0.009,
                radius: 2.3,
                branches: 4,
                spin: 2.5,
                randomness: 2,
                randomnessPower: 3,
                insideColor: '#ffffff',
                outsideColor: '#38bdf8'
            };

        let material = null; 
        let geometry = null; 
        let points = null; 

        const generateGalaxy = () => {
                if (points !== null) {
            geometry.dispose();
            material.dispose();
            scene.remove(points);
        }

        material = new THREE.PointsMaterial({
            size: parameters.size,
            sizeAttenuation: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
            vertexColors: true
                });

            geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(parameters.count * 3);
            const colors = new Float32Array(parameters.count * 3);
            const colorInside = new THREE.Color(parameters.insideColor);
            const colorOutside = new THREE.Color(parameters.outsideColor);

                for (let i = 0; i < parameters.count; i++) {
                    const i3 = i * 3;
                    const radius = Math.random() * parameters.radius;
                    const spinAngle = radius * parameters.spin;
                    const branchAngle = (i % parameters.branches) / parameters.branches * Math.PI * 2;
                
                    const randomX = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1);
                    const randomY = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1);
                    const randomZ = Math.pow(Math.random(), parameters.randomnessPower) * (Math.random() < 0.5 ? 1 : -1);

                    positions[i3] = Math.cos(branchAngle + spinAngle) * radius + randomX;
                    positions[i3 + 1] = randomY * 0.4;
                    positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + randomZ;

                const mixedColor = colorInside.clone();
                    mixedColor.lerp(colorOutside, radius / parameters.radius);

                colors[i3] = mixedColor.r;
                    colors[i3 + 1] = mixedColor.g;
                    colors[i3 + 2] = mixedColor.b;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            points = new THREE.Points(geometry, material);
            scene.add(points);
            };

        generateGalaxy();

        const sizes = {
            width: window.innerWidth,
            height: window.innerHeight
            };

            const camera = new THREE.PerspectiveCamera(75, sizes.width / sizes.height, 0.1, 100);
            camera.position.set(2.5, 2.5, 2.5);
            scene.add(camera);

            const controls = new THREE.OrbitControls(camera, canvas);
            controls.enableDamping = true;
            controls.enablePan = false;
            controls.enableZoom = false;

        const renderer = new THREE.WebGLRenderer({
                canvas: canvas,
                antialias: true
            });
            renderer.setSize(sizes.width, sizes.height);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x000000, 0);

            window.addEventListener('resize', () => {
                sizes.width = window.innerWidth;
                sizes.height = window.innerHeight;

                camera.aspect = sizes.width / sizes.height;
                camera.updateProjectionMatrix();

                renderer.setSize(sizes.width, sizes.height);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            });

            const clock = new THREE.Clock();

            const tick = () => {
                const elapsedTime = clock.getElapsedTime();

                controls.update();

                camera.position.x = Math.cos(elapsedTime * 0.04) * 3;
                camera.position.z = Math.sin(elapsedTime * 0.04) * 3;
                camera.lookAt(0, 0, 0);

                renderer.render(scene, camera);

                window.requestAnimationFrame(tick);
            };

            tick();
        });
    </script>

    <script>
        function toggleLanguage() {
            const currentLang = document.getElementById('langText').textContent;
            const newLang = currentLang === 'EN' ? 'TR' : 'EN';
            document.getElementById('langText').textContent = newLang;
        }
        
        $(function(){
            function hataAc(icerik){
                $("#hataMesaji").text(icerik);
                $("#hata").show();
                $("#onay").hide();
            }
            
            function onayAc(icerik){
                $("#onayMesaji").text(icerik);
                $("#onay").show();
                $("#hata").hide();
            }

            // Yerel fallback listesi — Supabase erişilemezse kullanılır
            const DEFAULT_AUDITOR_PASSWORD = "Crowe2022!";
            const fallbackAuditors = [
                "ibrahim.kuvvet@crowehsy.net", "yunusemre.durmus@crowehsy.net",
                "berki.ozkan@crowehsy.net", "dilan.ulusu@crowehsy.net",
                "aykan.altintel@crowehsy.net", "beste.darcan@crowehsy.net",
                "fatih.senturk@crowehsy.net", "kasim.durmus@crowehsy.net",
                "yaprak.tosun@crowehsy.net", "nida.cetin@crowehsy.net",
                "dilek.cinar2@crowehsy.net", "elif.girgin@crowehsy.net",
                "servet.aykanat@crowehsy.net", "cevahir.dogan@crowehsy.net",
                "adar.kilic@crowehsy.net", "hasan.bozkaya@crowehsy.net",
                "mesut.molla@crowehsy.net", "s.korkmaz@crowehsy.net",
                "serdar.karaagin@crowehsy.net"
            ];

            function saveAuditorSession(email) {
                localStorage.setItem('auditorUser', email);
            }

            function goDashboard() {
                onayAc("Giriş başarılı! Yönlendiriliyorsunuz...");
                setTimeout(function() {
                    window.location.href = 'auditor-dashboard.html';
                }, 600);
            }

            async function supabaseAuditorLogin(email, password) {
                const client = (typeof window.getSupabaseClient === 'function') ? window.getSupabaseClient() : null;
                if (!client) return { ok: false, reason: 'no-client' };

                const { data, error } = await client.auth.signInWithPassword({ email: email, password: password });
                if (error || !data || !data.session) {
                    return { ok: false, reason: 'auth-failed', message: error ? error.message : '' };
                }

                // Denetçi kaydını ve askı durumunu kontrol et
                try {
                    const res = await client
                        .from('auditor_team_members')
                        .select('email, full_name, team, role, status')
                        .eq('email', email)
                        .maybeSingle();

                    if (res.data) {
                        if (res.data.status === 'suspended') {
                            await client.auth.signOut();
                            return { ok: false, reason: 'suspended' };
                        }
                        localStorage.setItem('auditorProfile', JSON.stringify(res.data));
                    }
                } catch (e) { /* tablo yoksa auth yeterli */ }

                return { ok: true };
            }

            function localFallbackLogin(email, password) {
                const stored = localStorage.getItem("auditorPassword_" + email) || DEFAULT_AUDITOR_PASSWORD;
                if (!fallbackAuditors.includes(email) || stored !== password) return false;

                const changed = localStorage.getItem("auditorPasswordChanged_" + email) === 'true';
                saveAuditorSession(email);
                if (stored === DEFAULT_AUDITOR_PASSWORD || !changed) {
                    localStorage.setItem('auditorPendingPasswordChange', email);
                    onayAc("İlk giriş tespit edildi. Lütfen yeni bir şifre belirleyin...");
                    setTimeout(function() {
                        window.location.href = 'auditor-password-change.html';
                    }, 600);
                } else {
                    localStorage.removeItem('auditorPendingPasswordChange');
                    goDashboard();
                }
                return true;
            }

            $("#auditorLoginBtn").click(async function(e){
                e.preventDefault();
                
                var kul = $("#auditorKul").val();
                var pas = $("#auditorPas").val();
                
                if (!kul || !pas) {
                    hataAc("Lütfen e-posta adresi ve şifre giriniz!");
                    return;
                }

                const email = kul.toLowerCase().trim();

                // 1) Supabase Auth dene
                try {
                    const result = await supabaseAuditorLogin(email, pas);
                    if (result.ok) {
                        saveAuditorSession(email);
                        localStorage.removeItem('auditorPendingPasswordChange');
                        goDashboard();
                        return;
                    }
                    if (result.reason === 'suspended') {
                        hataAc("Hesabınız askıya alınmış. Yöneticinizle iletişime geçin.");
                        return;
                    }
                } catch (err) {
                    console.warn('Supabase auditor login hatası:', err);
                }

                // 2) Yerel fallback
                if (!localFallbackLogin(email, pas)) {
                    hataAc("Kullanıcı adı veya şifre hatalı!");
                }
            });
        });
    </script>
