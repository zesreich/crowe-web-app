    <script>
        // Check authentication on page load (DOMContentLoaded ile geciktir)
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                if (typeof Auth !== 'undefined' && !Auth.isAuthenticated()) {
            window.location.href = 'login.html';
        }
            }, 100);
        });
        
        // Update user info in topbar (same as other pages)
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(function() {
                const currentUser = Auth.getCurrentUser();
                if (currentUser) {
                    // username field contains the email address
                    const userEmail = currentUser.username || currentUser.email || currentUser.fullName || currentUser.full_name;
                    const userEmailElement = document.getElementById('userEmail');
                    if (userEmailElement) {
                        userEmailElement.textContent = userEmail;
                    }
                }
            }, 100);
        });
        
        // Also update immediately if DOM is already loaded
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(function() {
        const currentUser = Auth.getCurrentUser();
        if (currentUser) {
                    const userEmail = currentUser.username || currentUser.email || currentUser.fullName || currentUser.full_name;
                    const userEmailElement = document.getElementById('userEmail');
                    if (userEmailElement) {
                        userEmailElement.textContent = userEmail;
                    }
                }
            }, 100);
        }
        
        // Get Supabase client helper function
        function getSupabaseClient() {
            if (typeof window.supabase !== 'undefined' && window.SUPABASE_URL && window.SUPABASE_ANON_KEY) {
                if (!window.SUPABASE_URL.includes('YOUR_') && !window.SUPABASE_ANON_KEY.includes('YOUR_')) {
                    return window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);
                }
            }
            return null;
        }
        
        // Supabase CRUD functions for reports
        async function getReportsFromSupabase() {
            const supabase = getSupabaseClient();
            if (!supabase) {
                const reports = localStorage.getItem('reports');
                return reports ? JSON.parse(reports) : [];
            }
            
            try {
                const { data, error } = await supabase
                    .from('reports')
                    .select('*')
                    .order('start_date', { ascending: false });
                
                if (error) {
                    console.error('Supabase error:', error);
                    const reports = localStorage.getItem('reports');
                    return reports ? JSON.parse(reports) : [];
                }
                
                // Convert Supabase format to local format
                return (data || []).map(r => ({
                    id: r.id,
                    company: r.company,
                    service: r.service,
                    reportType: r.report_type,
                    startDate: r.start_date,
                    endDate: r.end_date,
                    team: r.team,
                    status: r.status,
                    createdAt: r.created_at
                }));
            } catch (error) {
                console.error('Error fetching reports:', error);
                const reports = localStorage.getItem('reports');
                return reports ? JSON.parse(reports) : [];
            }
        }
        
        async function addReportToSupabase(report) {
            const supabase = getSupabaseClient();
            if (!supabase) {
                const reports = JSON.parse(localStorage.getItem('reports') || '[]');
                reports.push(report);
                localStorage.setItem('reports', JSON.stringify(reports));
                return { success: true, data: report };
            }
            
            try {
                const { data, error } = await supabase
                    .from('reports')
                    .insert([{
                        company: report.company,
                        service: report.service,
                        report_type: report.reportType,
                        start_date: report.startDate,
                        end_date: report.endDate,
                        team: report.team,
                        status: report.status
                    }])
                    .select()
                    .single();
                
                if (error) {
                    console.error('Supabase insert error:', error);
                    throw error;
                }
                
                // Also save to localStorage as backup
                const reports = JSON.parse(localStorage.getItem('reports') || '[]');
                reports.push({
                    id: data.id,
                    company: data.company,
                    service: data.service,
                    reportType: data.report_type,
                    startDate: data.start_date,
                    endDate: data.end_date,
                    team: data.team,
                    status: data.status,
                    createdAt: data.created_at
                });
                localStorage.setItem('reports', JSON.stringify(reports));
                
                return { success: true, data: data };
            } catch (error) {
                console.error('Error adding report:', error);
                // Fallback to localStorage
                const reports = JSON.parse(localStorage.getItem('reports') || '[]');
                reports.push(report);
                localStorage.setItem('reports', JSON.stringify(reports));
                return { success: true, data: report };
            }
        }
        
        async function updateReportInSupabase(id, report) {
            const supabase = getSupabaseClient();
            if (!supabase) {
                const reports = JSON.parse(localStorage.getItem('reports') || '[]');
                const index = reports.findIndex(r => r.id === id);
                if (index !== -1) {
                    reports[index] = report;
                    localStorage.setItem('reports', JSON.stringify(reports));
                }
                return { success: true };
            }
            
            try {
                const { error } = await supabase
                    .from('reports')
                    .update({
                        company: report.company,
                        service: report.service,
                        report_type: report.reportType,
                        start_date: report.startDate,
                        end_date: report.endDate,
                        team: report.team,
                        status: report.status
                    })
                    .eq('id', id);
                
                if (error) throw error;
                
                // Also update localStorage
                const reports = JSON.parse(localStorage.getItem('reports') || '[]');
                const index = reports.findIndex(r => r.id === id);
                if (index !== -1) {
                    reports[index] = report;
                    localStorage.setItem('reports', JSON.stringify(reports));
                }
                
                return { success: true };
            } catch (error) {
                console.error('Error updating report:', error);
                // Fallback to localStorage
                const reports = JSON.parse(localStorage.getItem('reports') || '[]');
                const index = reports.findIndex(r => r.id === id);
                if (index !== -1) {
                    reports[index] = report;
                    localStorage.setItem('reports', JSON.stringify(reports));
                }
                return { success: true };
            }
        }
        
        async function deleteReportFromSupabase(id) {
            const supabase = getSupabaseClient();
            if (!supabase) {
                let reports = JSON.parse(localStorage.getItem('reports') || '[]');
                reports = reports.filter(report => report.id !== id);
                localStorage.setItem('reports', JSON.stringify(reports));
                return { success: true };
            }
            
            try {
                const { error } = await supabase
                    .from('reports')
                    .delete()
                    .eq('id', id);
                
                if (error) throw error;
                
                // Also update localStorage
                let reports = JSON.parse(localStorage.getItem('reports') || '[]');
                reports = reports.filter(report => report.id !== id);
                localStorage.setItem('reports', JSON.stringify(reports));
                
                return { success: true };
            } catch (error) {
                console.error('Error deleting report:', error);
                // Fallback to localStorage
                let reports = JSON.parse(localStorage.getItem('reports') || '[]');
                reports = reports.filter(report => report.id !== id);
                localStorage.setItem('reports', JSON.stringify(reports));
                return { success: true };
            }
        }
        
        // Load reports from localStorage
        async function loadReports() {
            const reports = await getReportsFromSupabase();
            const tbody = document.getElementById('reportsTableBody');
            
            if (reports.length === 0) {
                tbody.innerHTML = '<tr><td colspan="9" class="text-center text-muted">Henüz rapor kaydı bulunmamaktadır.</td></tr>';
                return;
            }
            
            // Sort by date (newest first)
            reports.sort((a, b) => new Date(b.startDate) - new Date(a.startDate));
            
            tbody.innerHTML = '';
            reports.forEach((report, index) => {
                let statusBadge = '';
                if (report.status === 'Tamamlandı') {
                    statusBadge = 'badge-success';
                } else if (report.status === 'Devam Ediyor') {
                    statusBadge = 'badge-warning';
                } else {
                    statusBadge = 'badge-info';
                }
                
                let typeBadge = report.reportType === 'SPK' ? 'badge-spk' : 'badge-kgk';
                
                const downloadBtn = report.status === 'Tamamlandı' 
                    ? '<button class="btn btn-sm btn-primary ml-1" title="İndir"><i class="fas fa-download"></i></button>'
                    : '<button class="btn btn-sm btn-secondary disabled ml-1" title="Henüz hazır değil"><i class="fas fa-download"></i></button>';
                
                const row = `
                    <tr>
                        <td class="text-center">${index + 1}</td>
                        <td>${report.company}</td>
                        <td>${report.service}</td>
                        <td class="text-center"><span class="badge ${typeBadge}">${report.reportType}</span></td>
                        <td class="text-center">${new Date(report.startDate).toLocaleDateString('tr-TR')}</td>
                        <td class="text-center">${new Date(report.endDate).toLocaleDateString('tr-TR')}</td>
                        <td>${report.team}</td>
                        <td class="text-center"><span class="badge ${statusBadge}">${report.status}</span></td>
                        <td class="text-center">
                            <button class="btn btn-sm btn-warning" onclick="editReport(${report.id})" title="Düzenle">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button class="btn btn-sm btn-danger ml-1" onclick="deleteReport(${report.id})" title="Sil">
                                <i class="fas fa-trash"></i>
                            </button>
                            ${downloadBtn}
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }
        
        // Form submission
        document.getElementById('reportForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const report = {
                id: Date.now(),
                company: document.getElementById('companyName').value,
                service: document.getElementById('reportService').value,
                reportType: document.getElementById('reportTypeSelect').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                team: document.getElementById('teamName').value,
                status: document.getElementById('statusSelect').value,
                createdAt: new Date().toISOString()
            };
            
            // Add report to Supabase (with fallback to localStorage)
            try {
                const result = await addReportToSupabase(report);
                if (result.success) {
            // Reload table
                    await loadReports();
            
            // Reset form
            this.reset();
            
            alert('Rapor başarıyla eklendi!');
                }
            } catch (error) {
                console.error('Error saving report:', error);
                alert('Rapor kaydedilirken bir hata oluştu. Lütfen tekrar deneyin.');
            }
        });
        
        // Delete report
        async function deleteReport(id) {
            if (!confirm('Bu raporu silmek istediğinizden emin misiniz?')) {
                return;
            }
            
            try {
                await deleteReportFromSupabase(id);
                await loadReports();
            alert('Rapor başarıyla silindi!');
            } catch (error) {
                console.error('Error deleting report:', error);
                alert('Rapor silinirken bir hata oluştu. Lütfen tekrar deneyin.');
            }
        }
        
        // Edit report (placeholder for future)
        async function editReport(id) {
            const reports = await getReportsFromSupabase();
            const report = reports.find(r => r.id === id);
            
            if (!report) {
                alert('Rapor bulunamadı!');
                return;
            }
            
            // TODO: Implement edit modal similar to payments
            alert('Düzenleme özelliği yakında eklenecek!');
        }
        
        // Load reports on page load
        $(document).ready(function() {
            loadReports();
        });
    </script>
</body>
</html>
