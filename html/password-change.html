<!DOCTYPE html>
<html lang="tr">
<head>
  <script>
  (function(){try{document.documentElement.setAttribute('data-theme','light');document.documentElement.classList.remove('darkmode');document.documentElement.removeAttribute('data-brand');}catch(e){}})();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Şifre Değiştir | HSY Crowe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="atlas-shell.css" rel="stylesheet">
  <style>
    body {
      min-height: 100dvh;
      margin: 0;
      background:
        radial-gradient(ellipse at 10% 0%, rgba(253,185,19,0.18), transparent 45%),
        linear-gradient(160deg, #fafafa 0%, #f3f3f3 100%);
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    .change-card {
      width: 100%;
      max-width: 28rem;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 1rem;
      padding: 1.5rem;
      box-shadow: 0 12px 40px rgba(0,0,0,0.06);
    }
    .change-card h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .subtitle {
      margin: 0.5rem 0 1.1rem;
      color: #5b5b5b;
      font-size: 0.875rem;
      line-height: 1.5;
    }
    .rule-list {
      margin: 0 0 1rem;
      padding: 0.75rem 0.9rem;
      background: #fafafa;
      border: 1px solid #ececec;
      border-radius: 0.65rem;
      font-size: 0.8rem;
      color: #444;
    }
    .rule-list li { margin: 0.2rem 0; }
    label { font-size: 0.8125rem; font-weight: 600; }
    .form-control {
      border-radius: 0.65rem;
      height: 2.7rem;
      background: #fafafa;
    }
    .btn-primary {
      background: #fdb913;
      border-color: #fdb913;
      color: #111;
      font-weight: 700;
      border-radius: 0.65rem;
      height: 2.75rem;
    }
    .btn-primary:hover { filter: brightness(0.96); background: #fdb913; border-color: #fdb913; color: #111; }
    .badge-user {
      display: inline-block;
      font-size: 0.75rem;
      background: #111;
      color: #fdb913;
      border-radius: 999px;
      padding: 0.2rem 0.65rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="change-card">
    <div class="d-flex justify-content-between align-items-start mb-2">
      <h1>Şifrenizi güncelleyin</h1>
      <span class="badge-user" id="userBadge">HSY Crowe</span>
    </div>
    <p class="subtitle">
      İlk girişte veya sıfırlama sonrası yeni bir şifre belirlemeniz gerekir.
    </p>
    <ul class="rule-list">
      <li>En az 8 karakter</li>
      <li>1 büyük harf, 1 küçük harf, 1 rakam, 1 özel işaret</li>
      <li>Hatırlatıcı kelime zorunlu</li>
      <li>Hatırlatıcı, şifre veya şifrenin tersi olamaz</li>
    </ul>

    <div id="alertArea"></div>

    <form id="passwordChangeForm" novalidate>
      <div class="form-group">
        <label for="newPassword">Yeni şifre</label>
        <input type="password" class="form-control" id="newPassword" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Yeni şifre (tekrar)</label>
        <input type="password" class="form-control" id="confirmPassword" required autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="passwordHint">Hatırlatıcı kelime</label>
        <input type="text" class="form-control" id="passwordHint" required placeholder="Şifreyi hatırlatacak kelime" autocomplete="off">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Şifreyi kaydet</button>
    </form>
    <div class="text-center mt-3">
      <a href="login.html" style="font-size:0.85rem;color:#666;"><i class="ph ph-arrow-left"></i> Giriş ekranına dön</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script>
    if (!Auth.isAuthenticated() && !Auth.getPendingPasswordChange()) {
      window.location.href = 'login.html';
    }

    var currentUser = Auth.getCurrentUser() || Auth.getPendingPasswordChange();
    if (currentUser) {
      document.getElementById('userBadge').textContent = currentUser.username || currentUser.email || 'HSY Crowe';
    }

    var form = document.getElementById('passwordChangeForm');
    var alertArea = document.getElementById('alertArea');

    function showAlert(type, message) {
      alertArea.innerHTML = '<div class="alert alert-' + type + '">' + message + '</div>';
    }

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var newPassword = document.getElementById('newPassword').value;
      var confirmPassword = document.getElementById('confirmPassword').value;
      var hint = document.getElementById('passwordHint').value.trim();

      if (newPassword !== confirmPassword) {
        showAlert('danger', 'Şifreler eşleşmiyor.');
        return;
      }

      var check = Auth.validatePasswordRules(newPassword, hint);
      if (!check.ok) {
        showAlert('danger', check.error);
        return;
      }

      try {
        var result = await Auth.changePassword(newPassword, hint);
        if (!result.success) {
          showAlert('danger', result.error || 'Şifre güncellenemedi.');
          return;
        }
        showAlert('success', 'Şifre güncellendi. Yönlendiriliyorsunuz…');
        setTimeout(function () {
          window.location.href = 'dashboard.html';
        }, 700);
      } catch (err) {
        console.error(err);
        showAlert('danger', 'Beklenmeyen bir hata oluştu.');
      }
    });
  </script>
</body>
</html>
